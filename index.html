<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI训练师理论题库练习 v1</title>
<style>
:root{--blue:#305496;--blue2:#4472c4;--green:#16a34a;--red:#dc2626;--bg:#f3f5f9;--line:#d7dce5;--txt:#1f2937}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--txt);font-size:16px}
#app{max-width:920px;margin:0 auto;padding:14px 14px 60px}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(20,40,90,.08);padding:18px;margin-bottom:14px}
h1{font-size:20px;margin:8px 0 2px}
h2{font-size:16px;margin:0 0 12px;color:var(--blue)}
.sub{color:#6b7280;font-size:13px;margin-bottom:12px}
.btn{display:inline-block;border:none;border-radius:10px;padding:11px 18px;font-size:15px;cursor:pointer;background:var(--blue);color:#fff;margin:4px 6px 4px 0;transition:filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue2)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#f0f4fb;border-radius:10px;padding:12px;text-align:center}
.stat .num{font-size:24px;font-weight:700;color:var(--blue)}
.stat .lbl{font-size:12px;color:#6b7280}
.chips{margin:4px 0 10px}
.chip{display:inline-block;font-size:12px;border-radius:20px;padding:2px 10px;margin-right:6px;background:#e8eef9;color:#33508f}
.chip.d1{background:#e7f6ec;color:#15803d}.chip.d2{background:#fdf3e3;color:#b45309}.chip.d3{background:#fdeaea;color:#b91c1c}
.banktabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.btab{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 18px;font-size:14px;cursor:pointer;color:#4b5563}
.btab.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.favbtn{cursor:pointer;border:1px solid transparent}
.favbtn:hover{filter:brightness(.96)}
.favbtn.on{background:#fff3cd;color:#b45309}
.qtext{font-size:17px;line-height:1.65;margin:6px 0 14px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:11px 14px;margin:8px 0;font-size:15px;line-height:1.5;cursor:pointer;transition:all .12s;touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--blue2);background:#f6f9ff}
.opt .letter{display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;background:#e8eef9;color:#33508f;font-size:13px;font-weight:700;margin-right:8px;flex:none}
.opt{display:flex;align-items:flex-start}
.opt.correct{border-color:var(--green);background:#edf9f1}
.opt.correct .letter{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:#fdf0f0}
.opt.wrong .letter{background:var(--red);color:#fff}
.opt.selected{border-color:var(--blue2);background:#eef4ff}
.opt:disabled{cursor:default}
.explain{border-left:4px solid var(--blue2);background:#f4f7fd;border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px;line-height:1.65;margin-top:12px}
.verdict{font-weight:700;margin:10px 0 2px}
.verdict.ok{color:var(--green)}.verdict.no{color:var(--red)}
.reasons{margin-top:10px;font-size:13px;color:#6b7280}
.reasons .r{display:inline-block;border:1px solid var(--line);border-radius:16px;padding:3px 12px;margin-right:6px;cursor:pointer;background:#fff}
.reasons .r.on{background:#fff7ed;border-color:#f59e0b;color:#b45309}
.topbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.pbar{height:8px;background:#e5eaf2;border-radius:6px;overflow:hidden;margin-bottom:14px}
.pbar>div{height:100%;background:var(--blue2);transition:width .25s}
.pal{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pcell{width:34px;height:30px;line-height:30px;text-align:center;font-size:12px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
.pcell.ans{background:#dbe7fb;border-color:var(--blue2)}
.pcell.ok{background:#d8f0e0;border-color:var(--green)}
.pcell.no{background:#fadcda;border-color:var(--red)}
.pcell.cur{outline:2.5px solid var(--blue)}
.pcell:disabled{opacity:.5;cursor:not-allowed}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.tb th{background:#eef2fa}
table.tb td:first-child{text-align:left}
select{padding:8px 10px;border-radius:8px;border:1.5px solid var(--line);font-size:14px;background:#fff;margin:4px 6px 4px 0;max-width:100%}
.timer{font-size:20px;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.timer.warn{color:var(--red)}
.footer-nav{display:flex;justify-content:space-between;margin-top:16px}
.review-q{border-bottom:1px solid var(--line);padding:14px 0}
.mini{font-size:13px;color:#6b7280}
.okline{color:var(--green);font-weight:600}.noline{color:var(--red);font-weight:600}
@media(max-width:640px){#app{padding:10px 10px 40px}.grid4{grid-template-columns:repeat(2,1fr)}.card{padding:14px}.qtext{font-size:16px}}
.hidden{display:none}
.examhead{position:sticky;top:0;z-index:10;background:#fff;border-radius:12px;box-shadow:0 2px 6px rgba(20,40,90,.12);padding:10px 16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const BANK_SIM = [{"type":"单选","difficulty":"易","question":"MLOps的核心目标是？","options":{"A":"仅专注于提高算法的准确率，不考虑工程落地","B":"实现机器学习模型从开发、测试、部署到监控更新的全流程自动化与标准化","C":"手动管理每一台服务器的硬件配置","D":"替代数据科学家的所有工作"},"answer":"B","explanation":"MLOps把软件工程DevOps理念延伸到机器学习全生命周期，覆盖数据、训练、微调、测试、上线、监控、更新全流程的自动化与标准化。A、C、D分别以偏概全或夸大其范围。依据省赛技术文件4.1节官方样题及大纲第5条。","source":"省赛技术文件4.1节官方样题","spot":true,"id":"NLP-001","domain":"NLP与大模型","verified":true},{"type":"多选","difficulty":"易","question":"下列哪些网络属于循环神经网络（RNN）？","options":{"A":"门控循环单元（GRU）","B":"卷积神经网络（CNN）","C":"Transformer网络","D":"长短期记忆网络（LSTM）"},"answer":"AD","explanation":"GRU与LSTM都是RNN的门控改进变体；CNN面向空间局部特征，Transformer基于自注意力且可完全并行，二者均不属于循环结构。依据省赛技术文件4.1节官方样题。","source":"省赛技术文件4.1节官方样题","spot":true,"id":"DP-001","domain":"深度学习与神经网络","verified":true},{"type":"判断","difficulty":"易","question":"在数据标注与模型训练过程中，为了提升团队效率，人工智能训练师可以在不包含姓名、手机号等直接身份信息的前提下，把样本数据（含聊天内容、图片、语音片段等）发到个人社交群里请同事帮忙复核，因为这些数据已经不算敏感信息。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"聊天内容、图片、语音等可能构成个人信息甚至敏感个人信息，去除了姓名、手机号并不等于完成脱敏，仍存在再识别风险；数据流转必须限制在授权、受控的工作环境内。依据省赛技术文件4.1节官方样题。","source":"省赛技术文件4.1节官方样题","spot":true,"id":"LAW-001","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"依据《中华人民共和国个人信息保护法》，处理个人信息应当遵循的基本原则是？","options":{"A":"合法、正当、必要和诚信","B":"高效、快速、经济、自由","C":"公开、共享、免费、透明","D":"保密、独占、可控、盈利"},"answer":"A","explanation":"《个人信息保护法》确立处理个人信息应遵循合法、正当、必要和诚信原则，并实行目的限制与最小化。其他选项均不是法定原则。依据大纲第6条。","source":"原创","id":"LAW-002","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"依据《中华人民共和国个人信息保护法》第二十八条，下列不属于敏感个人信息的是？","options":{"B":"毕业院校信息","A":"生物识别信息","C":"医疗健康信息","D":"行踪轨迹信息"},"answer":"B","explanation":"敏感个人信息包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等信息，以及不满十四周岁未成年人的个人信息；毕业院校属于一般个人信息。依据《个人信息保护法》第二十八条。","source":"原创","spot":true,"id":"LAW-003","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"依据《中华人民共和国个人信息保护法》，处理敏感个人信息在取得个人同意方面应当采用的方式是？","options":{"C":"取得个人的单独同意","A":"取得公司的内部审批","B":"采用一揽子默认勾选","D":"只需口头告知无需同意"},"answer":"C","explanation":"处理敏感个人信息应当取得个人的单独同意，并具有特定的目的和充分的必要性；默认勾选、内部审批或口头告知均不能替代单独同意。依据《个人信息保护法》第二十九条。","source":"原创","id":"LAW-004","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"处理不满十四周岁未成年人个人信息的正确做法是？","options":{"D":"取得父母或其他监护人同意并制定专门处理规则","A":"未成年人自行勾选同意即可","B":"无需任何同意直接处理","C":"只需在学校官网公示即可处理"},"answer":"D","explanation":"依据《个人信息保护法》第三十一条，处理不满十四周岁未成年人个人信息应当取得其父母或其他监护人同意，并制定专门的个人信息处理规则。","source":"原创","id":"LAW-005","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"国家标准GB/T 41867-2022的正式名称是？","options":{"A":"《信息技术 人工智能 术语》","B":"《信息技术 人工智能 机器学习系统技术要求》","C":"《人工智能大模型 通用要求》","D":"《信息安全技术 个人信息安全规范》"},"answer":"A","explanation":"GB/T 41867-2022是《信息技术 人工智能 术语》，是人工智能术语的推荐性国家标准。B为GB/T 43782-2024，C对应GB/T 45288.X-2025系列。依据省赛技术文件附件3第7条。","source":"原创","spot":true,"id":"LAW-006","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"我国现行的《人工智能训练师国家职业技能标准》版本是？","options":{"B":"2021年版","A":"2019年版","C":"2023年版","D":"2025年版"},"answer":"B","explanation":"现行《人工智能训练师国家职业技能标准》为2021年版，省赛即以其三级/高级工为基础命题。依据省赛技术文件附件3第5条。","source":"原创","id":"LAW-007","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"依据《生成式人工智能服务管理暂行办法》，服务提供者对其提供的生成内容依法承担的责任性质是？","options":{"C":"网络信息内容生产者责任","A":"纯技术服务方免责","B":"仅承担带宽提供者责任","D":"与内容完全无关的通道责任"},"answer":"C","explanation":"《生成式人工智能服务管理暂行办法》明确提供者应当依法承担网络信息内容生产者责任，并与使用者签订服务协议明确双方权利义务，不能以技术中立为由完全免责。依据大纲第6条。","source":"原创","id":"LAW-008","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"依据《生成式人工智能服务管理暂行办法》，提供者针对未成年人用户应当采取的有效措施是？","options":{"D":"防范过度依赖或者沉迷","A":"向未成年人推送个性化广告","B":"默认向其开放全部生成功能","C":"无需任何专门保护措施"},"answer":"D","explanation":"该办法要求提供者明确并公开服务的适用人群、场合、用途，采取有效措施防范未成年人用户过度依赖或者沉迷生成式人工智能服务。","source":"原创","id":"LAW-009","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"深度合成服务生成的AI换脸视频可能导致公众混淆或者误认时，提供者应当采取的措施是？","options":{"A":"对生成内容进行显著标识","B":"无需标识由用户自行判断","C":"仅在用户投诉后补标识","D":"在视频末尾用小字致谢即可"},"answer":"A","explanation":"依据《互联网信息服务深度合成管理规定》，对智能对话、合成人声、人脸生成、沉浸式拟真场景等可能导致公众混淆或者误认的深度合成内容，应当使用显著方式进行标识。","source":"原创","id":"LAW-010","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"将大模型生成的代码部署到生产环境前，从安全合规角度推荐的稳妥做法是？","options":{"B":"先在沙盒等隔离环境中运行验证","A":"直接在生产服务器上试运行","C":"交给外部网友远程测试","D":"生成后立即全量上线"},"answer":"B","explanation":"沙盒隔离（AI生成代码在隔离环境中运行）是人工智能安全的基本要求，可防止生成代码中的缺陷或恶意行为直接危害生产系统。依据大纲第50条。","source":"原创","id":"LAW-011","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"对抗样本攻击的基本含义是？","options":{"C":"在输入中加入难以察觉的微小扰动使模型误判","A":"用大量正常样本对模型进行训练","B":"物理盗走服务器上的硬盘","D":"在数据集中补充更多标注样本"},"answer":"C","explanation":"对抗样本指通过对输入施加人眼或人耳难以察觉的微小扰动，使模型输出错误结果（如熊猫被识别为长臂猿），是模型安全加固的重点对象。依据大纲第50条。","source":"原创","id":"LAW-012","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"数据脱敏的核心目标是？","options":{"D":"降低个人信息可识别性同时保留数据可用性","A":"彻底删除全部业务数据","B":"把数据加密到完全无法使用","C":"提高数据采集的速度和规模"},"answer":"D","explanation":"数据脱敏（如掩码、泛化、假名化）旨在消除或弱化个人可识别性，同时尽量保留数据的分析、训练价值；彻底删除或加密到不可用都偏离了该目标。依据大纲第19条。","source":"原创","id":"LAW-013","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"依据《中华人民共和国网络安全法》第四十一条，网络运营者收集、使用个人信息的正确做法是？","options":{"A":"公开规则、明示目的方式和范围并经同意","B":"先收集后补告知、默认即同意","C":"仅在用户投诉时说明用途","D":"以提升体验为由超范围收集"},"answer":"A","explanation":"《网络安全法》第四十一条要求遵循合法、正当、必要原则，公开收集使用规则，明示目的、方式和范围，并经被收集者同意。B、C、D均违反该要求。","source":"原创","id":"LAW-014","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"关于匿名化与假名化的区别，正确的说法是？","options":{"B":"假名化后的信息仍属于个人信息，匿名化后的不属于","A":"两者效果完全相同可互换使用","C":"匿名化后的信息仍属于个人信息","D":"假名化后信息即可自由公开出售"},"answer":"B","explanation":"匿名化指个人信息经处理无法识别特定自然人且不能复原，不再属于个人信息；假名化仍可借助额外信息复原识别，仍属个人信息并受《个人信息保护法》约束。","source":"原创","id":"LAW-015","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"我国网络实名制在《网络安全法》中的落实方式是？","options":{"C":"后台实名、前台自愿","A":"前台也必须全部实名公开","B":"所有平台一律免于实名","D":"仅外国用户需要实名"},"answer":"C","explanation":"《网络安全法》要求网络运营者为用户提供信息发布等服务时要求用户提供真实身份信息（后台实名），但前台展示可自愿选择匿名。","source":"原创","id":"LAW-016","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"《中华人民共和国网络安全法》确立的我国网络安全基础性管理制度是？","options":{"D":"网络安全等级保护制度","A":"全网统一采购制度","B":"单机杀毒软件准入制度","C":"网站流量排行公示制度"},"answer":"D","explanation":"《网络安全法》第二十一条明确国家实行网络安全等级保护制度，网络运营者需按等级履行安全保护义务。","source":"原创","id":"LAW-017","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"下列最可能被认定为关键信息基础设施的是？","options":{"A":"大型电网调度系统","B":"个人美食博客网站","C":"社区宠物领养论坛","D":"班级同学录小程序"},"answer":"A","explanation":"关键信息基础设施指一旦遭到破坏、丧失功能或者数据泄露，可能严重危害国家安全、国计民生、公共利益的重要网络设施和信息系统，公共通信、能源、交通、水利、金融等行业属于重点领域。","source":"原创","id":"LAW-018","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"向第三方提供其处理的个人信息时，个人信息处理者应当？","options":{"B":"向个人告知并取得其单独同意","A":"只需内部走审批流程","C":"直接打包出售无需告知","D":"在朋友圈公告即可转移"},"answer":"B","explanation":"依据《个人信息保护法》第二十三条，向其他个人信息处理者提供其处理的个人信息的，应当向个人告知接收方的身份、联系方式、处理目的、处理方式和个人信息的种类，并取得个人的单独同意。","source":"原创","id":"LAW-019","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"依据《个人信息保护法》，自动化决策在交易价格等交易条件上实施不合理差别待遇的行为属于？","options":{"C":"违法，被明确禁止的大数据杀熟","A":"合法的精细化运营手段","B":"只对会员开放即可豁免","D":"经用户点击同意后即可实施"},"answer":"C","explanation":"《个人信息保护法》规定个人信息处理者利用个人信息进行自动化决策，应当保证决策透明度和结果公平、公正，不得对个人在交易价格等交易条件上实行不合理的差别待遇。","source":"原创","id":"LAW-020","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"仅通过自动化决策方式作出对个人权益有重大影响的决定时，个人的权利是？","options":{"D":"有权要求说明并有权拒绝","A":"只能无条件接受该决定","B":"只能向平台申请积分补偿","C":"有权要求永久关闭平台"},"answer":"D","explanation":"依据《个人信息保护法》第二十四条，通过自动化决策方式作出对个人权益有重大影响的决定，个人有权要求个人信息处理者予以说明，并有权拒绝个人信息处理者仅通过自动化决策的方式作出决定。","source":"原创","id":"LAW-021","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"下列不属于《个人信息保护法》规定的向境外提供个人信息合规途径的是？","options":{"A":"直接自由传输不受限制","B":"通过国家网信部门安全评估","C":"经专业机构个人信息保护认证","D":"按照国家网信部门制定的标准合同"},"answer":"A","explanation":"向境外提供个人信息需满足安全评估、保护认证或标准合同等法定条件之一，并采取必要措施保障境外接收方处理活动达到本法保护标准，不存在自由传输通道。依据《个人信息保护法》第三十八条。","source":"原创","id":"LAW-022","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"《中华人民共和国数据安全法》确立的国家基本制度是？","options":{"B":"数据分类分级保护制度","A":"数据一律禁止流通制度","C":"全民数据平均分配制度","D":"数据出口退税鼓励制度"},"answer":"B","explanation":"《数据安全法》第二十一条规定国家建立数据分类分级保护制度，对数据实行分类分级保护，关系国家安全的重要数据与国家核心数据实行更严格管理。依据大纲第6条。","source":"原创","id":"LAW-023","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"依据《数据安全法》，需要申报数据安全审查的情形是？","options":{"C":"数据处理活动影响或可能影响国家安全","A":"企业内部换用新的报表工具","B":"个人更换家用路由器","D":"网站改版更换配色方案"},"answer":"C","explanation":"《数据安全法》规定国家建立数据安全审查制度，对影响或者可能影响国家安全的数据处理活动进行国家安全审查。","source":"原创","id":"LAW-024","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"国家标准GB/T 43782-2024的正式名称是？","options":{"D":"《信息技术 人工智能 机器学习系统技术要求》","A":"《信息技术 人工智能 术语》","B":"《智能制造 系统集成要求》","C":"《数据管理能力成熟度评估模型》"},"answer":"D","explanation":"GB/T 43782-2024为《信息技术 人工智能 机器学习系统技术要求》。D与A（GB/T 41867-2022）是省赛文件明确引用的两项人工智能国标。依据省赛技术文件附件3第7条。","source":"原创","id":"LAW-025","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"《生成式人工智能服务管理暂行办法》正式施行的日期是？","options":{"A":"2023年8月15日","B":"2021年9月1日","C":"2022年1月1日","D":"2024年3月15日"},"answer":"A","explanation":"《生成式人工智能服务管理暂行办法》于2023年8月15日起施行。B为《数据安全法》施行日期。依据大纲第6条所列法规。","source":"原创","spot":true,"id":"LAW-026","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"《互联网信息服务深度合成管理规定》正式施行的日期是？","options":{"B":"2023年1月10日","A":"2017年6月1日","C":"2021年11月1日","D":"2025年1月1日"},"answer":"B","explanation":"《互联网信息服务深度合成管理规定》自2023年1月10日起施行。A为《网络安全法》、C为《个人信息保护法》施行日期。依据大纲第6条所列法规。","source":"原创","id":"LAW-027","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"中","question":"依据《生成式人工智能服务管理暂行办法》，提供者使用的训练数据应当满足的基本要求是？","options":{"C":"具有合法来源，不侵害知识产权，涉及个人信息应取得同意","A":"只要爬得到的数据都可自由使用","B":"无需关注数据来源真实性","D":"仅允许使用境外公开数据集"},"answer":"C","explanation":"该办法要求提供者使用具有合法来源的数据和基础模型，不得侵害他人依法享有的知识产权，涉及个人信息的应当征得个人信息主体同意或者符合法定情形，并采取措施提高训练数据质量。依据大纲第6条。","source":"原创","id":"LAW-028","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"k-匿名技术的隐私保护含义是？","options":{"D":"每条记录至少与k-1条其他记录在准标识符上不可区分","A":"数据集中恰好保留k个敏感字段","B":"把数据加密k次后发布","C":"仅允许k个人访问数据集"},"answer":"D","explanation":"k-匿名要求发布数据中每条记录在准标识符属性上至少与其他k-1条记录相同，使攻击者难以唯一锁定特定个人；它并不等于加密或访问控制。","source":"原创","id":"LAW-029","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"依据《个人信息保护法》，下列情形中应当事前进行个人信息保护影响评估的是？","options":{"A":"处理敏感个人信息","B":"向本人提供其信息的查询副本","C":"系统内部日志例行留存","D":"匿名化统计汇总后的报表发布"},"answer":"A","explanation":"处理敏感个人信息、利用个人信息进行自动化决策、委托处理或向他人提供或公开个人信息、向境外提供个人信息等情形，应当事前进行个人信息保护影响评估。B、C、D不属于法定必须评估的情形。","source":"原创","id":"LAW-030","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"国家标准GB/T 45288.X-2025对应的标准系列是？","options":{"B":"《人工智能大模型》系列标准","A":"《信息安全技术》系列标准","C":"《软件工程质量度量》系列标准","D":"《云计算服务安全》系列标准"},"answer":"B","explanation":"GB/T 45288.X-2025为《人工智能大模型》系列标准，与GB/T 41867-2022、GB/T 43782-2024同为省赛文件列明参照的行业标准。依据省赛技术文件附件3第7条。","source":"原创","id":"LAW-031","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"提供具有舆论属性或者社会动员能力的生成式人工智能服务，除安全评估外还应当履行的手续是？","options":{"C":"按照规定履行算法备案手续","A":"向行业协会缴纳保证金","B":"取得全体用户书面授权","D":"在电视媒体公开源代码"},"answer":"C","explanation":"依据《生成式人工智能服务管理暂行办法》，具有舆论属性或者社会动员能力的生成式人工智能服务应当按照国家有关规定开展安全评估，并履行算法备案手续。","source":"原创","id":"LAW-032","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"深度合成服务提供者和技术支持者提供人脸、人声等生物识别信息编辑功能时，对使用者的要求是？","options":{"D":"提示其依法告知被编辑的个人并取得单独同意","A":"只需提示使用者妥善保管作品","B":"无需提示，风险由用户自担","C":"仅需在发布平台点击同意条款"},"answer":"D","explanation":"依据《互联网信息服务深度合成管理规定》，提供人脸、人声等生物识别信息编辑功能的，应当提示深度合成服务使用者依法告知被编辑的个人，并取得其单独同意。","source":"原创","id":"LAW-033","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"提示注入攻击的基本含义是？","options":{"A":"通过在输入中嵌入恶意指令诱导模型执行未授权操作","B":"向服务器机房注入虚假电源","C":"在键盘上高频敲击回车键","D":"批量注册账号消耗算力配额"},"answer":"A","explanation":"提示注入（Prompt Injection）指攻击者在输入（网页、文档、对话）中夹带恶意指令，诱导大模型偏离原设定、泄露信息或调用工具越权操作，是大模型安全对齐的重点风险。依据大纲第50条。","source":"原创","id":"LAW-034","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"在信贷审批等高风险场景中强调模型可解释性设计，最主要的目的是？","options":{"B":"使决策过程可理解、可追责并支撑申诉复核","A":"让模型参数量变得更大","C":"完全消除模型的一切预测误差","D":"绕开监管部门的合规审查"},"answer":"B","explanation":"模型可解释性设计要求关键决策能被理解和追溯，保障算法公平与用户申诉权利；它既不消除误差，也不能用于规避监管。依据大纲第51条。","source":"原创","id":"LAW-035","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"未经授权抓取受版权保护的图书全文用于商业化大模型训练，正确的认识是？","options":{"C":"存在知识产权侵权风险，应取得授权或进行合规审查","A":"训练用途属于合理使用，天然免责","B":"只要删除书名页就没有任何风险","D":"版权只保护纸质书，电子文本不受保护"},"answer":"C","explanation":"《生成式人工智能服务管理暂行办法》要求训练数据合法且不得侵害知识产权，版权保护不因载体形式而消失，商业训练使用需授权或经合规评估。","source":"原创","id":"LAW-036","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"《生成式人工智能服务管理暂行办法》的适用范围是？","options":{"D":"利用生成式人工智能技术向境内公众提供生成内容的服务","A":"仅限境外企业在华办事处","B":"只约束科研机构的实验室内部实验","C":"所有个人在本机的离线推理"},"answer":"D","explanation":"该办法适用于利用生成式人工智能技术向中华人民共和国境内公众提供生成文本、图片、音频、视频等内容的服务；未向境内公众提供服务的研发与内部使用不直接适用。","source":"原创","id":"LAW-037","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"关于AI生成内容的著作权归属，目前较为稳妥的理解是？","options":{"A":"是否构成作品需结合人类独创性投入等因素个案判断","B":"AI生成内容一律自动归用户所有","C":"AI生成内容一律归模型厂商所有","D":"AI生成内容在任何国家都不可能受保护"},"answer":"A","explanation":"司法实践中，纯机器自动生成、缺乏人类独创性投入的内容其作品属性存在争议；含有人类创作安排的生成物可能获得保护，需个案判断，不存在一律归属用户的规则。","source":"原创","id":"LAW-038","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"关于GB/T 41867-2022的性质，正确的说法是？","options":{"B":"属于推荐性国家标准，鼓励采用","A":"属于强制性国家标准必须执行","C":"属于企业内部标准自愿公开","D":"属于国际标准全球强制适用"},"answer":"B","explanation":"标准代号中含“/T”表示推荐性标准（GB/T），无“/T”的GB才是强制性标准。GB/T 41867-2022是推荐性国家标准。","source":"原创","id":"LAW-039","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"某团队开发了深度合成引擎，只向其他企业提供技术接口、不直接面向公众提供服务，其在《互联网信息服务深度合成管理规定》中的角色是？","options":{"C":"深度合成服务技术支持者","A":"深度合成服务提供者","B":"深度合成服务使用者","D":"深度合成服务监管者"},"answer":"C","explanation":"规定区分了服务提供者（面向公众提供深度合成服务）与技术支持者（为服务提供技术支持），两者义务有所区别；只输出技术能力、不直接服务公众的属于技术支持者。","source":"原创","id":"LAW-040","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"难","question":"关于GPL开源协议的核心特点，正确的说法是？","options":{"D":"具有传染性，衍生作品须以相同协议开源","A":"允许闭源商用且无任何义务","B":"使用前必须向基金会付费","C":"仅限个人学习禁止商业使用"},"answer":"D","explanation":"GPL是强著佐权（Copyleft）协议，基于GPL代码的衍生作品分发时必须以相同协议开源；A描述的是MIT等宽松协议的特征。","source":"原创","id":"LAW-041","domain":"法律法规与职业伦理","verified":true},{"type":"判断","difficulty":"中","question":"个人信息一旦依法公开，任何组织就可以完全不受限制地收集、使用该信息。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"处理已公开的个人信息仍应在合理的范围内进行；个人明确拒绝的，或者处理活动对个人权益有重大影响的，应当取得个人同意。","source":"原创","id":"LAW-042","domain":"法律法规与职业伦理","verified":true},{"type":"判断","difficulty":"中","question":"经过脱敏处理的数据集，仍可能通过与其他数据集关联分析实现再识别。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"脱敏不等于绝对安全，准标识符组合（如邮编+生日+性别）可与外部数据链接导致再识别，因此需要评估再识别风险，必要时采用k-匿名等技术。","source":"原创","id":"LAW-043","domain":"法律法规与职业伦理","verified":true},{"type":"判断","difficulty":"中","question":"只要用户输入的提示词违法导致生成违法内容，生成式AI服务提供者一律不承担任何责任。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"提供者承担网络信息内容生产者责任，发现违法内容应当及时采取处置措施；同时发现使用者利用服务从事违法活动的，应警示、限制功能、暂停或终止服务并保存记录、报告主管部门。","source":"原创","id":"LAW-044","domain":"法律法规与职业伦理","verified":true},{"type":"判断","difficulty":"中","question":"MIT协议下的开源软件允许商业使用和闭源分发，但需保留原作者的版权声明。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"MIT是宽松型协议，允许商用、修改、闭源分发，核心义务是保留版权与许可声明；与GPL的传染性开源要求形成对比。","source":"原创","id":"LAW-045","domain":"法律法规与职业伦理","verified":true},{"type":"判断","difficulty":"难","question":"只要从数据集中删除了姓名和手机号两个字段，该数据集就属于匿名化数据，可以对外出售。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"匿名化要求经处理后无法识别特定自然人且不能复原；仅删除姓名和手机号仍可能通过其他字段组合再识别，属于假名化或简单去标识化，仍按个人信息管理。","source":"原创","id":"LAW-046","domain":"法律法规与职业伦理","verified":true},{"type":"判断","difficulty":"难","question":"依据《数据安全法》，重要数据一旦泄露可能危害国家安全、经济运行等，其保护要求严于一般数据。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"数据分类分级保护制度下，重要数据实行重点保护，国家核心数据（关系国家安全、国民经济命脉、重要民生等）实行更加严格的管理制度。","source":"原创","id":"LAW-047","domain":"法律法规与职业伦理","verified":true},{"type":"判断","difficulty":"易","question":"训练数据中包含用户个人信息时，即使有利于模型效果提升，也不得超出授权范围使用。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"个人信息处理应遵循目的限制与最小必要原则，超出授权目的使用属于违规；模型收益不能成为豁免合规的理由。依据大纲第19条。","source":"原创","id":"LAW-048","domain":"法律法规与职业伦理","verified":true},{"type":"多选","difficulty":"易","question":"依据《个人信息保护法》，下列属于敏感个人信息的有？","options":{"C":"生物识别信息","B":"不满十四周岁未成年人的个人信息","A":"行踪轨迹信息","D":"员工的工作邮箱前缀"},"answer":"ABC","explanation":"敏感个人信息包括生物识别、宗教信仰、特定身份、医疗健康、金融账户、行踪轨迹等及不满十四周岁未成年人信息；普通工作邮箱前缀属于一般个人信息。依据《个人信息保护法》第二十八条。","source":"原创","id":"LAW-049","domain":"法律法规与职业伦理","verified":true},{"type":"多选","difficulty":"易","question":"人工智能应用中常见且需要治理的伦理风险包括？","options":{"C":"算法歧视与不公平结果","B":"隐私泄露与数据滥用","A":"深度伪造被用于诈骗","D":"生成虚假信息误导公众"},"answer":"ABCD","explanation":"以上均为AI伦理治理的核心风险场景，对应算法公平性、隐私保护、深度合成滥用与内容真实性问题。依据大纲第50、51条。","source":"原创","id":"LAW-050","domain":"法律法规与职业伦理","verified":true},{"type":"多选","difficulty":"易","question":"下列符合人工智能训练师职业行为规范的做法有？","options":{"B":"标注数据前制定规范并对标注员培训","D":"对含个人信息的样本先脱敏再流转","C":"如实记录模型评估结果不夸大指标","A":"为赶项目进度跳过数据合规审查"},"answer":"BCD","explanation":"职业规范要求规范标注、保护隐私、诚信报告；跳过合规审查违反职业守则与数据合规要求。依据大纲第51条。","source":"原创","id":"LAW-051","domain":"法律法规与职业伦理","verified":true},{"type":"多选","difficulty":"中","question":"依据《生成式人工智能服务管理暂行办法》，服务提供者应当履行的义务包括？","options":{"B":"使用具有合法来源的数据和基础模型","C":"对图片、视频等生成内容依法进行标识","D":"与使用者签订服务协议明确双方权利义务","A":"发现违法内容后放任传播以保持中立"},"answer":"BCD","explanation":"B、C、D均为办法明文的提供者义务；发现违法内容应当及时采取停止生成、消除等处置措施并保存记录、向主管部门报告，A直接违反该义务。","source":"原创","id":"LAW-052","domain":"法律法规与职业伦理","verified":true},{"type":"多选","difficulty":"中","question":"下列属于常用数据脱敏技术手段的有？","options":{"B":"掩码（如手机号中间四位以*代替）","C":"泛化（如精确年龄替换为年龄段）","D":"假名化（以随机编号替代真实姓名）","A":"数据增强（对样本同义改写扩充）"},"answer":"BCD","explanation":"掩码、泛化、假名化都是降低可识别性的脱敏手段；数据增强用于扩充训练样本规模，属于数据加工而非脱敏。","source":"原创","id":"LAW-053","domain":"法律法规与职业伦理","verified":true},{"type":"多选","difficulty":"中","question":"关于开源协议与合规，下列说法正确的有？","options":{"A":"MIT协议允许商业使用并允许闭源分发","C":"基于GPL代码的衍生作品分发时须以相同协议开源","D":"Apache License 2.0包含专利授权条款","B":"开源软件没有版权，可随意据为己有"},"answer":"ACD","explanation":"开源软件同样受著作权保护，使用者须遵守相应协议条款；B错误。A、C、D分别是MIT宽松性、GPL传染性、Apache专利授权的准确描述。","source":"原创","id":"LAW-054","domain":"法律法规与职业伦理","verified":true},{"type":"多选","difficulty":"难","question":"依据《个人信息保护法》，下列可以作为处理个人信息合法性基础的情形有？","options":{"D":"取得个人同意","C":"订立、履行个人作为一方当事人的合同所必需","A":"为履行法定职责或者法定义务所必需","B":"公司希望训练更强大的模型"},"answer":"ACD","explanation":"法定合法性基础包括同意、合同必需、法定职责义务必需、应对突发公共卫生事件等情形；“有利于业务或技术进步”不是合法性基础。依据《个人信息保护法》第十三条。","source":"原创","id":"LAW-055","domain":"法律法规与职业伦理","verified":true},{"type":"多选","difficulty":"难","question":"针对大模型应用的提示注入攻击，有效的防御措施包括？","options":{"C":"对用户输入与检索回的内容做过滤和隔离","D":"为模型及所调用工具配置最小必要权限","A":"对输出进行检测并对敏感操作要求人工确认","B":"单纯增大模型参数量"},"answer":"ACD","explanation":"提示注入防御依赖输入侧过滤隔离、权限最小化、输出审查与人机协同确认等纵深措施；仅增大参数量并不能消除注入风险。","source":"原创","id":"LAW-056","domain":"法律法规与职业伦理","verified":true},{"type":"单选","difficulty":"易","question":"事件A与B相互独立，P(A)=0.5，P(B)=0.4，则P(A∪B)等于？","options":{"A":"0.7","B":"0.9","C":"0.2","D":"0.6"},"answer":"A","explanation":"独立时P(A∪B)=P(A)+P(B)−P(A)P(B)=0.5+0.4−0.2=0.7。B错在直接相加未扣除交集，C只是P(A)−P(B)的结果无概率意义。","source":"原创","id":"MATH-001","domain":"数学基础","verified":true},{"type":"单选","difficulty":"易","question":"一组数据方差为25，则其标准差为？","options":{"B":"5","A":"25","C":"625","D":"12.5"},"answer":"B","explanation":"标准差是方差的算术平方根，√25=5；A是方差本身，C是方差再平方，D是方差的一半。","source":"原创","id":"MATH-002","domain":"数学基础","verified":true},{"type":"单选","difficulty":"易","question":"关于正态分布，均值、中位数与众数的关系是？","options":{"C":"三者相等","A":"均值总大于中位数","B":"众数总为负数","D":"三者互不相等"},"answer":"C","explanation":"正态分布关于均值对称且单峰，均值、中位数、众数重合于对称中心。A、D只可能出现在偏态分布中。","source":"原创","id":"MATH-003","domain":"数学基础","verified":true},{"type":"单选","difficulty":"易","question":"某试验成功概率p=0.5，独立重复n=10次，成功次数的期望是？","options":{"D":"5","A":"2.5","B":"10","C":"0.5"},"answer":"D","explanation":"二项分布期望E(X)=np=10×0.5=5。","source":"原创","id":"MATH-004","domain":"数学基础","verified":true},{"type":"单选","difficulty":"易","question":"矩阵A的维度为3×4，矩阵B的维度为4×2，则乘积AB的维度是？","options":{"A":"3×2","B":"4×4","C":"2×3","D":"无法相乘"},"answer":"A","explanation":"矩阵乘法要求左矩阵列数等于右矩阵行数（4=4满足），结果维度取左矩阵行数×右矩阵列数，即3×2。","source":"原创","id":"MATH-005","domain":"数学基础","verified":true},{"type":"单选","difficulty":"易","question":"关于矩阵乘法AB与BA，一般的结论是？","options":{"B":"通常不相等甚至不可交换","A":"永远相等","C":"永远等于单位矩阵","D":"永远等于零矩阵"},"answer":"B","explanation":"矩阵乘法不满足交换律，维度不同时BA甚至没有定义；只有特殊矩阵（如互逆矩阵）才有AB=BA。","source":"原创","id":"MATH-006","domain":"数学基础","verified":true},{"type":"单选","difficulty":"易","question":"两个非零向量正交（垂直）的充要条件是它们的内积等于？","options":{"C":"0","A":"1","B":"-1","D":"两向量模的乘积"},"answer":"C","explanation":"内积公式a·b=|a||b|cosθ，正交时θ=90°、cosθ=0，故内积为0。D对应θ=0°（同向平行）的情形。","source":"原创","id":"MATH-007","domain":"数学基础","verified":true},{"type":"单选","difficulty":"易","question":"z-score标准化的计算公式是？","options":{"D":"(x−μ)/σ","A":"(x−min)/(max−min)","B":"x/μ","C":"σ/(x−μ)"},"answer":"D","explanation":"z-score标准化减去均值再除以标准差，结果均值为0、标准差为1。A是min-max归一化，结果落在[0,1]。","source":"原创","id":"MATH-008","domain":"数学基础","verified":true},{"type":"单选","difficulty":"易","question":"函数f(x)=x²在x=3处的导数是？","options":{"A":"6","B":"3","C":"9","D":"2"},"answer":"A","explanation":"f'(x)=2x，代入x=3得6。D是导函数的系数，未代值。","source":"原创","id":"MATH-009","domain":"数学基础","verified":true},{"type":"单选","difficulty":"易","question":"数据集[1, 1, 2, 3, 4, 5, 6, 9]的中位数是？","options":{"B":"3.5","A":"3","C":"4","D":"2"},"answer":"B","explanation":"数据已升序排列，共8个（偶数个），中位数取第4、5个数（3和4）的平均值3.5。A、C分别是第4、5个数本身。","source":"原创","id":"MATH-010","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"随机变量X的期望E(X)=5，则E(2X+3)等于？","options":{"C":"13","A":"10","B":"15","D":"8"},"answer":"C","explanation":"期望具有线性性：E(2X+3)=2E(X)+3=2×5+3=13。A漏加常数，B误为2×(5+3)。","source":"原创","id":"MATH-011","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"随机变量X的方差Var(X)=2，则Var(2X)等于？","options":{"D":"8","A":"4","B":"2","C":"16"},"answer":"D","explanation":"方差性质Var(aX)=a²Var(X)，故Var(2X)=4×2=8。A错在只乘了系数a而未平方。","source":"原创","id":"MATH-012","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"正态分布下，数据落在均值±3倍标准差范围内的概率约为？","options":{"A":"99.7%","B":"95.4%","C":"68.3%","D":"50%"},"answer":"A","explanation":"3σ原则：±1σ约68.3%，±2σ约95.4%，±3σ约99.7%。B、C分别对应2σ与1σ。","source":"原创","id":"MATH-013","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"中心极限定理说明，当样本量足够大时，样本均值的分布近似为？","options":{"B":"正态分布","A":"均匀分布","C":"泊松分布","D":"原总体分布的复制"},"answer":"B","explanation":"无论总体分布如何，大样本的样本均值分布近似正态，这是统计推断的理论基础，也解释了为何正态分布在统计中普遍。","source":"原创","id":"MATH-014","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"伯努利大数定律揭示的规律是？","options":{"C":"独立重复试验中频率依概率收敛于概率","A":"样本均值必然严格等于总体均值","B":"方差随试验次数增加而增大","D":"小概率事件永远不会发生"},"answer":"C","explanation":"大数定律表明频率稳定于概率；A错在“必然严格等于”（是依概率收敛），D与“小概率事件必然发生”一样都是误解。","source":"原创","id":"MATH-015","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"贝叶斯定理的正确表达式是？","options":{"D":"P(A|B)=P(B|A)P(A)/P(B)","A":"P(A|B)=P(A)P(B)/P(B|A)","B":"P(A|B)=P(A)+P(B)","C":"P(A|B)=P(B|A)P(B)/P(A)"},"answer":"D","explanation":"贝叶斯定理由条件概率与全概率公式推出：后验P(A|B)=似然P(B|A)×先验P(A)/证据P(B)，是朴素贝叶斯分类器的数学基础。","source":"原创","id":"MATH-016","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"若随机变量X与Y相互独立，则它们的协方差Cov(X,Y)等于？","options":{"A":"0","B":"1","C":"-1","D":"Var(X)Var(Y)"},"answer":"A","explanation":"独立时E(XY)=E(X)E(Y)，故协方差为0；但反过来协方差为0只能说明不相关，不能推出独立。","source":"原创","id":"MATH-017","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"求矩阵A特征值λ需满足的方程是？","options":{"B":"det(A−λI)=0","A":"det(A−λI)=1","C":"det(A)+λ=0","D":"A−λI=O"},"answer":"B","explanation":"特征值由特征方程det(A−λI)=0求解，对应非零解向量即特征向量；D要求矩阵本身为零矩阵，与特征值无关。","source":"原创","id":"MATH-018","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"对角矩阵diag(2, 3)的两个特征值之和（即矩阵的迹）是？","options":{"C":"5","A":"6","B":"2","D":"3"},"answer":"C","explanation":"对角矩阵的特征值就是对角元素2和3，其和等于迹5。A是对角元素之积（即行列式）。","source":"原创","id":"MATH-019","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"转置运算满足的性质是？","options":{"D":"(AB)^T=B^T A^T","A":"(AB)^T=A^T B^T","B":"(AB)^T=AB","C":"(AB)^T=(BA)^T"},"answer":"D","explanation":"乘积转置等于转置的反序乘积（穿脱原理），A是常见错误；仅当两个矩阵为对称且可交换时，B才可能成立。","source":"原创","id":"MATH-020","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"某数据集Q1=20，Q3=40，依据箱线图经验法则，非异常值的上界约为？","options":{"A":"70","B":"60","C":"80","D":"100"},"answer":"A","explanation":"IQR=Q3−Q1=20，上须线为Q3+1.5×IQR=40+30=70，超过70的点视为疑似异常值。B、C均未按1.5倍系数计算。","source":"原创","spot":true,"id":"MATH-021","domain":"数学基础","verified":true},{"type":"单选","difficulty":"中","question":"某指标近似服从正态分布，μ=50，σ=5，依据3σ原则，正常取值范围约为？","options":{"B":"[35, 65]","A":"[45, 55]","C":"[40, 60]","D":"[30, 70]"},"answer":"B","explanation":"μ±3σ=50±15=[35,65]，约99.7%数据落入其中，常用于异常检测。A、C分别对应1σ、2σ。","source":"原创","id":"MATH-022","domain":"数学基础","verified":true},{"type":"单选","difficulty":"难","question":"某病患病率1%，检测灵敏度99%（患病者阳性的概率），误报率5%（健康者阳性的概率）。某人检测为阳性，其真正患病的概率最接近？","options":{"C":"约16.7%","A":"约99%","B":"约95%","D":"约50%"},"answer":"C","explanation":"贝叶斯计算：P(病|阳)=0.99×0.01/(0.99×0.01+0.05×0.99)=0.0099/0.0594≈16.7%。因患病率低，多数阳性来自误报；A、B混淆了灵敏度与后验概率。","source":"原创","spot":true,"id":"MATH-023","domain":"数学基础","verified":true},{"type":"单选","difficulty":"难","question":"计算样本方差时除以n−1而非n的原因是？","options":{"D":"使样本方差成为总体方差的无偏估计","A":"让数值更大更好看","B":"避免出现负数","C":"让均值等于零"},"answer":"D","explanation":"用样本均值代替总体均值损失了一个自由度，除以n会系统性低估总体方差；除以n−1（贝塞尔校正）得到无偏估计。","source":"原创","id":"MATH-024","domain":"数学基础","verified":true},{"type":"单选","difficulty":"难","question":"精确率P=0.6，召回率R=0.4，则F1值等于？","options":{"A":"0.48","B":"0.5","C":"0.24","D":"0.6"},"answer":"A","explanation":"F1是P与R的调和平均：2PR/(P+R)=2×0.6×0.4/1.0=0.48。B是算术平均（高估），C是乘积的一半（无此定义）。","source":"原创","id":"MATH-025","domain":"数学基础","verified":true},{"type":"单选","difficulty":"难","question":"已知Cov(X,Y)=0，由此可以得出的结论是？","options":{"B":"X与Y不相关，但不一定独立","A":"X与Y一定独立","C":"X与Y一定存在线性关系","D":"X与Y的方差都为0"},"answer":"B","explanation":"协方差为0等价于不相关，仅排除线性关系；存在非线性依赖（如Y=X²对称分布）时协方差仍可为0，故推不出独立。","source":"原创","id":"MATH-026","domain":"数学基础","verified":true},{"type":"单选","difficulty":"难","question":"两变量的皮尔逊相关系数r=0.8，则其决定系数r²等于？","options":{"C":"0.64","A":"0.8","B":"0.89","D":"0.32"},"answer":"C","explanation":"决定系数r²=0.64，在线性回归语境下表示约64%的方差可由线性关系解释。B是0.8开根号，D是把系数减半，均无依据。","source":"原创","id":"MATH-027","domain":"数学基础","verified":true},{"type":"单选","difficulty":"难","question":"掷两枚均匀骰子，已知点数之和为7，则第一枚点数为3的概率是？","options":{"D":"1/6","A":"1/36","B":"1/7","C":"1/2"},"answer":"D","explanation":"和为7的样本共6个：(1,6)(2,5)(3,4)(4,3)(5,2)(6,1)，其中第一枚为3的占1个，故条件概率=1/6。A是无条件概率（未使用条件）。","source":"原创","id":"MATH-028","domain":"数学基础","verified":true},{"type":"单选","difficulty":"难","question":"泊松分布最适合建模的随机现象是？","options":{"A":"单位时间内随机事件发生的次数","B":"两次试验的成败结果","C":"寿命服从的对称钟形分布","D":"区间内均匀取值的测量误差"},"answer":"A","explanation":"泊松分布刻画稀有事件在单位时间/空间内的计数（如客服每分钟来电数）。B是伯努利/二项，C对应正态，D对应均匀分布。","source":"原创","id":"MATH-029","domain":"数学基础","verified":true},{"type":"单选","difficulty":"难","question":"方阵A的行列式det(A)=0，则下列说法正确的是？","options":{"B":"A是奇异矩阵，不可逆","A":"A一定是对称矩阵","C":"A的特征值全为零","D":"A的秩等于其阶数"},"answer":"B","explanation":"行列式为0的方阵称为奇异矩阵，不存在逆矩阵，且0是其特征值之一（特征值之积=行列式=0）。D恰好相反：满秩要求行列式非零。","source":"原创","id":"MATH-030","domain":"数学基础","verified":true},{"type":"判断","difficulty":"易","question":"梯度下降法沿正梯度方向搜索函数的最小值。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"梯度是函数值上升最快的方向，最小化应沿负梯度方向移动；沿正梯度只会越走越大。","source":"原创","id":"MATH-031","domain":"数学基础","verified":true},{"type":"判断","difficulty":"易","question":"矩阵乘法满足结合律，即(AB)C=A(BC)。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"矩阵乘法满足结合律与分配律，不满足的是交换律，这是矩阵运算与普通数的乘法的关键差别。","source":"原创","id":"MATH-032","domain":"数学基础","verified":true},{"type":"判断","difficulty":"中","question":"方差的量纲是原始数据量纲的平方。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"方差由离差平方平均而来，量纲为原量纲的平方；这也是常取标准差（量纲与原数据一致）来描述离散程度的原因。","source":"原创","id":"MATH-033","domain":"数学基础","verified":true},{"type":"判断","difficulty":"中","question":"3σ原则适用于任意分布形态的数据做异常检测。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"3σ原则建立在正态分布（或近似正态）假设上；对严重偏态或多峰分布，应改用箱线图IQR法或分位数方法等。","source":"原创","id":"MATH-034","domain":"数学基础","verified":true},{"type":"判断","difficulty":"难","question":"两随机变量的皮尔逊相关系数为0，则它们一定相互独立。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"相关系数为0只说明不存在线性相关；如Y=X²且X对称取值时二者有确定函数关系但相关系数为0。独立必推出不相关，反之不成立。","source":"原创","id":"MATH-035","domain":"数学基础","verified":true},{"type":"判断","difficulty":"难","question":"在总体标准差不变的情况下，样本均值的标准误随样本量增大而减小。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"标准误SE=σ/√n，样本量n越大标准误越小，这正是大样本估计更精确、大数定律与中心极限定理发挥作用的表现。","source":"原创","id":"MATH-036","domain":"数学基础","verified":true},{"type":"多选","difficulty":"中","question":"下列可用于检测异常值（离群点）的统计方法有？","options":{"A":"3σ原则","C":"箱线图IQR法","B":"Z-score标准化后判|z|过大","D":"按字典序对类别变量排序"},"answer":"ABC","explanation":"A、C、B都是基于分布位置/距离的常用异常检测统计方法；D是普通排序操作，与异常检测无关。","source":"原创","id":"MATH-037","domain":"数学基础","verified":true},{"type":"多选","difficulty":"中","question":"关于正态分布N(μ, σ²)，下列说法正确的有？","options":{"A":"曲线关于x=μ对称","B":"约68.3%的数据落在μ±σ内","C":"约99.7%的数据落在μ±3σ内","D":"当μ≠0时它就不再是正态分布"},"answer":"ABC","explanation":"对称性及1σ/3σ覆盖率是正态分布基本性质；μ可以是任意实数，μ≠0只改变位置参数，D错误。","source":"原创","id":"MATH-038","domain":"数学基础","verified":true},{"type":"多选","difficulty":"难","question":"下列矩阵运算性质正确的有？","options":{"A":"(AB)^T=B^T A^T","C":"(A+B)^T=A^T+B^T","B":"AI=IA=A（I为单位矩阵）","D":"AB=BA恒成立"},"answer":"ABC","explanation":"转置反序律、转置分配律与单位矩阵性质均成立；矩阵乘法不满足交换律，D错误。","source":"原创","id":"MATH-039","domain":"数学基础","verified":true},{"type":"多选","difficulty":"难","question":"关于期望与方差，下列等式正确的有？","options":{"C":"E(aX+b)=aE(X)+b","B":"Var(aX)=a²Var(X)","A":"X与Y独立时Var(X+Y)=Var(X)+Var(Y)","D":"Var(aX)=aVar(X)"},"answer":"ABC","explanation":"期望线性性与方差平方式是基本性质，独立性使和的方差等于方差的和；D漏掉了平方，是最常见的记忆错误。","source":"原创","id":"MATH-040","domain":"数学基础","verified":true},{"type":"单选","difficulty":"易","question":"向列表末尾添加单个元素的Python方法是？","options":{"A":"append()","B":"add()","C":"push()","D":"insert_last()"},"answer":"A","explanation":"列表用append()在尾部追加单个元素；add()是集合的方法，push()是栈（如Python列表模拟）的习惯叫法而非列表方法。","source":"原创","id":"PY-001","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"关于元组（tuple）与列表（list）的区别，正确的说法是？","options":{"B":"元组创建后不可修改，列表可修改","A":"元组可修改，列表不可修改","C":"两者都完全不可修改","D":"两者没有任何区别"},"answer":"B","explanation":"元组是不可变序列，列表是可变序列；元组可作为字典的键而列表不能。","source":"原创","id":"PY-002","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"将列表[1, 2, 2, 3, 3, 3]转换为集合（set）后，其元素个数是？","options":{"C":"3","A":"6","B":"1","D":"0"},"answer":"C","explanation":"集合自动去重，{1,2,3}共3个元素，这也是集合常用于快速去重的原因。","source":"原创","id":"PY-003","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"字典中先后执行d['k']=1与d['k']=2后，d['k']的值与键的个数分别是？","options":{"D":"2和1","A":"1和2","B":"2和2","C":"报错"},"answer":"D","explanation":"字典的键唯一，对已有键赋值是覆盖而非新增，值更新为2、键仍只有1个。","source":"原创","id":"PY-004","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"len(\"人工智能\")的返回值是？","options":{"A":"3","B":"6","C":"1","D":"12"},"answer":"A","explanation":"Python3中字符串按Unicode码位计数，3个汉字长度为3；6是按UTF-8字节数误解的结果。","source":"原创","id":"PY-005","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"表达式\"abcdef\"[::-1]的值是？","options":{"B":"\"fedcba\"","A":"\"abcdef\"","C":"\"abcde\"","D":"\"f\""},"answer":"B","explanation":"切片[起点:终点:步长]，步长为-1表示逆序取全部字符，是反转字符串的惯用写法。","source":"原创","id":"PY-006","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"[x*2 for x in range(5)]的结果是？","options":{"C":"[0, 2, 4, 6, 8]","A":"[2, 4, 6, 8, 10]","B":"[1, 2, 3, 4, 5]","D":"[0, 2, 4]"},"answer":"C","explanation":"range(5)生成0~4，逐个乘2得[0,2,4,6,8]。A错把起点当作1，D漏掉了最后一个元素。","source":"原创","spot":true,"id":"PY-007","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"json.loads()函数的作用是？","options":{"D":"把JSON字符串解析为Python对象","A":"把Python对象序列化为JSON字符串","B":"从网络下载JSON文件","C":"校验JSON是否符合Schema"},"answer":"D","explanation":"loads（load string）解析字符串为Python对象（如dict/list）；序列化为字符串用dumps()。","source":"原创","id":"PY-008","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"pandas中df.head()默认返回的行数是？","options":{"A":"5","B":"10","C":"1","D":"20"},"answer":"A","explanation":"head()默认取前5行，可传参如head(10)查看前10行；快速预览数据形状与字段内容。","source":"原创","id":"PY-009","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"pandas中删除含有缺失值的行所使用的方法是？","options":{"B":"dropna()","A":"fillna()","C":"isna()","D":"drop_duplicates()"},"answer":"B","explanation":"dropna()删除含NaN的行/列，fillna()是填充缺失值，isna()只做缺失标记，drop_duplicates()去重。","source":"原创","id":"PY-010","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"栈这种数据结构遵循的存取原则是？","options":{"C":"后进先出（LIFO）","A":"先进先出（FIFO）","B":"随机访问","D":"按键排序访问"},"answer":"C","explanation":"栈只在一端进出，后进先出（如函数调用栈）；先进先出（FIFO）是队列的特征。","source":"原创","id":"PY-011","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"队列这种数据结构遵循的存取原则是？","options":{"D":"先进先出（FIFO）","A":"后进先出（LIFO）","B":"按键大小访问","C":"只能从中间访问"},"answer":"D","explanation":"队列从队尾入队、队头出队，先进先出；消息队列中间件即沿用该模型实现任务排队。","source":"原创","id":"PY-012","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"[1, 2].extend([3, 4])执行后列表变为？","options":{"A":"[1, 2, 3, 4]","B":"[[1, 2], [3, 4]]","C":"[1, 2, [3, 4]]","D":"[1, 2, 3]"},"answer":"A","explanation":"extend()把可迭代对象的元素逐个追加；C是append([3,4])把整个列表当作一个元素放入的结果。","source":"原创","id":"PY-013","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"关于sorted(lst)与lst.sort()，正确的说法是？","options":{"B":"sorted()返回新列表，sort()原地修改","A":"两者都返回新列表","C":"两者都原地修改","D":"sorted()只能用于字符串"},"answer":"B","explanation":"sorted()是内置函数，返回排序后的新列表不改原列表；list.sort()原地排序返回None，链式调用是常见错误。","source":"原创","id":"PY-014","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"list(range(1, 10, 3))的结果是？","options":{"C":"[1, 4, 7]","A":"[1, 3, 5, 7, 9]","B":"[1, 4, 7, 10]","D":"[3, 6, 9]"},"answer":"C","explanation":"range(起点, 终点, 步长)从1开始步长3，到不小于10前停止：1、4、7。B错在终点10不被包含，A是步长2的结果。","source":"原创","spot":true,"id":"PY-015","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"对字典d执行d.get('x', 0)时，若键'x'不存在，返回值是？","options":{"D":"0","A":"None","B":"KeyError异常","C":"空字符串"},"answer":"D","explanation":"get(键, 默认值)在键不存在时返回指定默认值0；不提供默认值时才返回None，直接d['x']才会抛KeyError。","source":"原创","id":"PY-016","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"for i, v in enumerate(['a','b','c'])循环中，第二轮的i与v分别是？","options":{"A":"1和'b'","B":"0和'b'","C":"2和'c'","D":"1和'a'"},"answer":"A","explanation":"enumerate()同时给出下标（默认从0起）与元素，第二轮即(1, 'b')，常用于需要位置信息的遍历。","source":"原创","id":"PY-017","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"re.match()与re.search()的区别是？","options":{"B":"match只从字符串开头匹配，search扫描任意位置","A":"match扫描任意位置，search只匹配开头","C":"两者都能且只能匹配字符串的开头部分","D":"search只能匹配数字字符，match匹配任意字符"},"answer":"B","explanation":"match()要求从起始位置匹配成功才返回，search()在全串中寻找第一个匹配，这是正则定位中最易混淆的一对API。","source":"原创","id":"PY-018","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"正则表达式\\d{3}匹配的内容是？","options":{"C":"连续的3位数字","A":"任意3个字符","B":"数字3本身","D":"3个字母"},"answer":"C","explanation":"\\d匹配一位数字，{3}表示恰好重复3次；任意字符用点号.，字母用[a-zA-Z]。","source":"原创","id":"PY-019","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"正则表达式中^与$的作用分别是？","options":{"D":"锚定字符串开头与结尾","A":"锚定字符串结尾与开头","B":"表示取反与注释","C":"表示乘方与美元符号"},"answer":"D","explanation":"^匹配行首、$匹配行尾，两者配合可做整串校验（如^\\d{11}$校验11位手机号）；[^...]中的^才是取反。","source":"原创","id":"PY-020","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"pandas中按标签选取行、列用loc，按整数位置选取用？","options":{"A":"iloc","B":"loc","C":"iat","D":"ix"},"answer":"A","explanation":"loc基于标签索引，iloc基于从0开始的整数位置索引，两者是DataFrame取数的基础API。","source":"原创","id":"PY-021","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"df.groupby('城市')直接查看每组的记录数，最合适的调用是？","options":{"B":"df.groupby('城市').size()","A":"df.groupby('城市').values","C":"df['城市'].mean()","D":"df.merge()"},"answer":"B","explanation":"groupby后需接聚合动作（size/count/mean/sum等）才能得到结果；不聚合的GroupBy对象只是中间状态。","source":"原创","id":"PY-022","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"pandas中merge()方法的功能类似于SQL中的？","options":{"C":"JOIN连接","A":"GROUP BY分组","B":"ORDER BY排序","D":"DISTINCT去重"},"answer":"C","explanation":"merge()按键拼接两张表，支持how参数取inner/left/right/outer，对应SQL的各类JOIN。","source":"原创","id":"PY-023","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"包含6个元素的一维数组reshape(2, 3)后，每行的元素个数是？","options":{"D":"3","A":"2","B":"6","C":"9"},"answer":"D","explanation":"reshape(2,3)得到2行3列，总元素数必须与原数组一致（6）。","source":"原创","id":"PY-024","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"Linux命令tail -f app.log的作用是？","options":{"A":"实时跟踪文件末尾新增内容","B":"删除文件前几行","C":"统计文件行数","D":"压缩归档日志文件"},"answer":"A","explanation":"tail -f持续输出文件尾部新写入的行，是排查服务运行日志的常用手段；统计行数用wc -l。","source":"原创","id":"PY-025","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"中","question":"Linux中修改文件权限应使用的命令是？","options":{"B":"chmod","A":"chown","C":"chpwd","D":"setperm"},"answer":"B","explanation":"chmod修改读写执行权限（如chmod 755）；chown改的是属主属组。","source":"原创","id":"PY-026","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"难","question":"Python中is与==的区别是？","options":{"C":"is比较对象标识（是否同一对象），==比较值","A":"is比较值，==比较长度","B":"两者完全等价","D":"is只能用于数字"},"answer":"C","explanation":"is判断两个名字是否指向同一对象（id相同），==调用__eq__比较内容；小整数缓存等现象更说明二者不可混用，判None应使用is。","source":"原创","id":"PY-027","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"难","question":"执行b=a.copy()（a=[[1,2],[3,4]]）后修改b[0][0]=9，则a[0][0]的值是？","options":{"D":"9","A":"1","B":"None","C":"报错"},"answer":"D","explanation":"copy()是浅拷贝，只复制最外层容器，内层子列表仍被共享，因此内层修改互相影响；需要完全独立应使用copy.deepcopy()。","source":"原创","id":"PY-028","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"难","question":"正则模式<a>(.*?)<\/a>中.*?的作用是？","options":{"A":"非贪婪匹配尽可能短的任意字符","B":"贪婪匹配尽可能长的字符","C":"只匹配一个字母","D":"匹配问号字符本身"},"answer":"A","explanation":"后接?将贪婪量词改为非贪婪，在成对标签场景中匹配最短内容，避免跨段吞并；问号本身需转义为\\?。","source":"原创","id":"PY-029","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"难","question":"对形状为(3, 4)的DataFrame执行sum(axis=0)，得到的结果是？","options":{"B":"长度为4的每列求和","A":"长度为3的每行求和","C":"一个标量总和","D":"形状不变的原数据"},"answer":"B","explanation":"axis=0表示沿行方向压缩（即对每一列求和），结果长度等于列数4；每行求和用axis=1。","source":"原创","id":"PY-030","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"难","question":"numpy中形状(3,4)的数组与形状(4,)的数组相加，结果的形状是？","options":{"C":"(3, 4)","A":"(4, 3)","B":"(3,)","D":"报错"},"answer":"C","explanation":"广播机制将(4,)按行扩展为(3,4)后逐元素相加，结果保持(3,4)；这是numpy向量化的基础特性。","source":"原创","id":"PY-031","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"难","question":"朴素递归实现的斐波那契数列fib(n)=fib(n-1)+fib(n-2)的时间复杂度约为？","options":{"D":"O(2^n)","A":"O(n)","B":"O(n log n)","C":"O(1)"},"answer":"D","explanation":"递归树每层分裂两个子问题且大量重复计算，规模指数级增长；记忆化或迭代可降为O(n)。","source":"原创","id":"PY-032","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"难","question":"快速排序在输入序列已经有序且取首元素为基准的 worst case 复杂度是？","options":{"A":"O(n²)","B":"O(n log n)","C":"O(n)","D":"O(log n)"},"answer":"A","explanation":"此时每次划分极度不平衡（1与n-1），递归深度达n，退化为O(n²)；随机选取基准或三数取中可规避该最坏情况。","source":"原创","id":"PY-033","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"难","question":"Linux下查看当前系统全部进程及其资源占用，最合适的命令是？","options":{"B":"ps aux","A":"ls -l","C":"cat /proc/cpuinfo","D":"top -delete"},"answer":"B","explanation":"ps aux列出所有进程的CPU、内存占用与命令行，配合grep可定位异常进程（如ps aux | grep python）。","source":"原创","id":"PY-034","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"难","question":"在当前目录及其子目录中按名称查找所有.py文件，正确的命令是？","options":{"C":"find . -name \"*.py\"","A":"grep . \"*.py\"","B":"ls -R | mkdir *.py","D":"chmod -R *.py ."},"answer":"C","explanation":"find 起始路径 -name 模式 是标准用法；grep用于在文件内容中检索而非按文件名查找。","source":"原创","id":"PY-035","domain":"Python与数据结构算法","verified":true},{"type":"判断","difficulty":"易","question":"Python集合（set）支持通过s[0]访问第一个元素。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"集合无序且元素唯一，不支持下标索引；需要有序可索引应使用列表或元组。","source":"原创","id":"PY-036","domain":"Python与数据结构算法","verified":true},{"type":"判断","difficulty":"易","question":"二分查找不要求序列有序，乱序数据同样可以直接使用。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"二分查找依靠中点比较不断折半缩小范围，前提是序列有序，否则无法判断目标在左半还是右半。","source":"原创","id":"PY-037","domain":"Python与数据结构算法","verified":true},{"type":"判断","difficulty":"中","question":"在Python中，表达式0.1+0.2==0.3的求值结果为False。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"二进制浮点数无法精确表示0.1与0.2，相加得0.30000000000000004，判等结果为False；浮点比较应使用误差容限。","source":"原创","id":"PY-038","domain":"Python与数据结构算法","verified":true},{"type":"判断","difficulty":"中","question":"pip install安装的第三方包默认存放在当前工作目录中。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"pip默认将包安装到当前Python解释器环境的site-packages目录，而非当前工作目录；项目隔离推荐使用虚拟环境venv。","source":"原创","id":"PY-039","domain":"Python与数据结构算法","verified":true},{"type":"判断","difficulty":"难","question":"Python字典的键必须使用不可变（可哈希）类型，例如字符串、数字或元组。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"字典依靠哈希定位键，列表等可变对象不可哈希，不能作为键；元组内的元素也必须都是不可变类型。","source":"原创","id":"PY-040","domain":"Python与数据结构算法","verified":true},{"type":"判断","difficulty":"难","question":"执行rows=[[0]*3]*3后，再执行rows[0][0]=1，则三行的首元素都变为1。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"[x]*3复制的是同一内层列表的引用，三行实际共享同一对象，改一处三处同变；正确初始化应使用[[0]*3 for _ in range(3)]。","source":"原创","id":"PY-041","domain":"Python与数据结构算法","verified":true},{"type":"多选","difficulty":"中","question":"pandas中与缺失值处理相关的方法有？","options":{"C":"dropna()","B":"fillna()","D":"isna()","A":"interpolate()"},"answer":"ABCD","explanation":"四个方法分别用于删除缺失行、填充缺失值、标记缺失位置和插值填充，均为缺失值处理的常用工具。","source":"原创","id":"PY-042","domain":"Python与数据结构算法","verified":true},{"type":"多选","difficulty":"中","question":"下列Linux命令与功能对应正确的有？","options":{"D":"grep——在文本中检索匹配行","C":"chmod——修改文件权限","A":"tail——查看文件末尾若干行","B":"ps——查看系统进程"},"answer":"ABCD","explanation":"四组对应均正确；配合管道（如ps aux | grep python | tail -n 5）可组合完成复杂排查。","source":"原创","id":"PY-043","domain":"Python与数据结构算法","verified":true},{"type":"多选","difficulty":"难","question":"下列排序算法平均时间复杂度为O(n log n)的有？","options":{"B":"归并排序","A":"快速排序","C":"堆排序","D":"冒泡排序"},"answer":"ABC","explanation":"归并、快排（平均）、堆排均为O(n log n)；冒泡排序为O(n²)。另注意归并稳定而快排不稳定。","source":"原创","id":"PY-044","domain":"Python与数据结构算法","verified":true},{"type":"多选","difficulty":"难","question":"关于正则表达式的元字符含义，下列正确的有？","options":{"A":"\\d匹配一位数字","B":"\\w匹配字母、数字或下划线","C":"+匹配前一项一次或多次","D":"^表示匹配字符串的结尾"},"answer":"ABC","explanation":"^锚定字符串开头，$才是结尾，D把两者记反了；A、B、C是高频使用的字符类与量词。","source":"原创","id":"PY-045","domain":"Python与数据结构算法","verified":true},{"type":"多选","difficulty":"难","question":"关于Python内置容器，下列说法正确的有？","options":{"D":"list可变且有序","A":"tuple不可变","C":"set元素唯一且无序","B":"list可以作为字典的键"},"answer":"ACD","explanation":"字典的键要求可哈希（不可变），列表可变故不能作键，B错误；D、A、C是三种基础容器的核心性质。","source":"原创","id":"PY-046","domain":"Python与数据结构算法","verified":true},{"type":"单选","difficulty":"易","question":"监督学习区别于无监督学习的根本特征是？","options":{"A":"训练样本带有标签","B":"必须使用神经网络","C":"只能处理图像数据","D":"不需要划分数据集"},"answer":"A","explanation":"监督学习从（输入，标签）样本对中学习映射，如分类与回归；无监督学习面对无标签数据，如聚类与降维。","source":"原创","id":"ML-001","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"下列任务中属于无监督学习的是？","options":{"B":"把客户自动分成若干群体","A":"预测明天的房价","C":"判断邮件是否为垃圾邮件","D":"识别验证码字符"},"answer":"B","explanation":"客户分群是聚类问题，无预定义标签；A是回归、C和D是分类，三者都属于监督学习。","source":"原创","id":"ML-002","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"分类任务与回归任务的本质区别在于输出？","options":{"C":"分类输出离散类别，回归输出连续数值","A":"分类输出连续数值，回归输出离散类别","B":"两者输出完全相同","D":"回归不需要训练数据"},"answer":"C","explanation":"分类预测离散标签（是/否、类别号），回归预测连续值（价格、温度）；这决定了两者使用不同的损失函数与评估指标。","source":"原创","id":"ML-003","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"使用K-means聚类时，簇的个数K需要？","options":{"D":"由使用者预先指定","A":"算法自动唯一确定","B":"必须等于样本数","C":"由系统随机分配且不可改"},"answer":"D","explanation":"K是K-means的超参数，需预先指定（可结合肘部法或轮廓系数选择）；这也是它的局限之一。","source":"原创","id":"ML-004","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"KNN（k近邻）算法被称为惰性学习的原因是？","options":{"A":"没有显式的训练过程，预测时才计算","B":"训练速度极慢","C":"只能用于文本","D":"不需要距离度量"},"answer":"A","explanation":"KNN直接保存训练样本，预测时才寻找k个最近邻投票，训练开销为零而预测开销大，与参数化模型的训练代价分布相反。","source":"原创","id":"ML-005","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"朴素贝叶斯分类器“朴素”的含义是？","options":{"B":"假设特征在给定类别下条件独立","A":"只使用一个特征","C":"准确率必然很低","D":"不使用概率"},"answer":"B","explanation":"为简化联合概率计算，朴素贝叶斯假设各特征在给定标签条件下相互独立；该假设虽常不严格成立，但实践中效果稳健。","source":"原创","id":"ML-006","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"逻辑回归（Logistic Regression）在机器学习中的任务类型是？","options":{"C":"分类","A":"回归","B":"聚类","D":"生成数据"},"answer":"C","explanation":"尽管名字含“回归”，逻辑回归通过Sigmoid把线性输出映射为概率，用于（二）分类，是多分类softmax回归的基础。","source":"原创","id":"ML-007","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"混淆矩阵中，召回率（Recall）的计算公式是？","options":{"D":"TP/(TP+FN)","A":"TP/(TP+FP)","B":"(TP+TN)/(TP+FP+FN+TN)","C":"TN/(TN+FP)"},"answer":"D","explanation":"召回率=TP/(TP+FN)，衡量实际正例中被正确识别的比例；A为精确率，B为准确率，C为特异度。","source":"原创","spot":true,"id":"ML-008","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"混淆矩阵中，精确率（Precision）的计算公式是？","options":{"A":"TP/(TP+FP)","B":"TP/(TP+FN)","C":"(TP+TN)/全部样本","D":"FP/(FP+TN)"},"answer":"A","explanation":"精确率=TP/(TP+FP)，衡量预测为正的样本中真正为正的比例；B是召回率，C是准确率，D是假警率（FPR）的分项。","source":"原创","id":"ML-009","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"准确率（Accuracy）的计算公式是？","options":{"B":"(TP+TN)/全部样本数","A":"TP/(TP+FN)","C":"TP/(TP+FP)","D":"TP/(TP+TN)"},"answer":"B","explanation":"准确率是全部预测正确的样本（TP+TN）占总样本的比例，适用于类别均衡场景，不平衡时易产生误导。","source":"原创","id":"ML-010","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"对“颜色：红/绿/蓝”这类类别特征，送入模型前的常用编码方式是？","options":{"C":"独热编码（One-Hot）","A":"直接当数值1/2/3","B":"按笔画排序编码","D":"随机赋予大整数"},"answer":"C","explanation":"独热编码将每个类别展开为互斥的0/1列，避免1/2/3这类数值编码引入虚假的大小与距离关系。","source":"原创","id":"ML-011","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"K折交叉验证的基本做法是？","options":{"D":"把数据分成K份，轮流以1份做验证、其余做训练","A":"重复训练K次同一模型取最好一次","B":"把数据复制K份全部用于训练","C":"随机抽取K个样本做验证"},"answer":"D","explanation":"K折交叉验证轮流使用每份做验证集，K次结果的平均更稳健地估计泛化性能，缓解单次划分的偶然性。","source":"原创","id":"ML-012","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"关于参数与超参数的区别，正确的说法是？","options":{"A":"超参数训练前设定，参数由训练学得","B":"两者都由反向传播自动学得","C":"参数需要人工指定，超参数自动优化","D":"两者是完全相同的概念"},"answer":"A","explanation":"参数（权重、偏置）由训练过程拟合数据得到；超参数（学习率、K、树深等）在训练前设定，需通过验证集或搜索调优。","source":"原创","id":"ML-013","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"K-means对初始质心敏感，多次运行结果不一致时常用的处理是？","options":{"B":"多次随机初始化取最优（如k-means++）","A":"把K改为样本数","C":"只允许运行一次","D":"先做独热编码再聚类"},"answer":"B","explanation":"不同初始质心可能收敛到不同局部最优，K-means++改进初始化或多轮取方差最小解是标准做法。","source":"原创","id":"ML-014","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"对“年收入（万）与年龄（岁）”两列直接跑K-means前通常先做标准化，主要原因是？","options":{"C":"量纲差异大的特征会主导距离计算","A":"标准化能自动确定K","B":"不标准化程序会报错","D":"标准化可消除所有噪声"},"answer":"C","explanation":"欧氏距离由数值大的特征主导，收入尺度远大于年龄会扭曲聚类；标准化把各特征拉到可比尺度。","source":"原创","id":"ML-015","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"与K-means相比，DBSCAN的显著特点是？","options":{"D":"基于密度，可发现任意形状簇并识别噪声点","A":"必须预先指定簇数K","B":"只能发现凸形（球形）簇","C":"对离群点必须强行归入某簇"},"answer":"D","explanation":"DBSCAN按密度扩张聚类，簇形状任意且能输出噪声点；它需要的是邻域半径eps与最小点数MinPts而非簇数K。","source":"原创","id":"ML-016","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"KNN中把K取得过小（如K=1）容易导致？","options":{"A":"对噪声敏感而过拟合","B":"决策边界过于平滑而欠拟合","C":"模型完全无法预测","D":"训练时间指数增长"},"answer":"A","explanation":"K过小时预测被个别近邻左右，对噪声敏感；K过大则邻域过宽趋于多数类，欠拟合，需用验证集折中选择。","source":"原创","id":"ML-017","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"BLEU指标评估机器翻译质量的主要依据是？","options":{"B":"候选译文与参考译文的n-gram精确匹配程度","A":"n-gram召回覆盖程度","C":"句法树结构完全一致","D":"译者人工评分的相关系数"},"answer":"B","explanation":"BLEU以n-gram精确率衡量生成译文中有多大比例出现在参考译文里，取值高代表用词准确；召回取向的对应指标是ROUGE。依据成都赛通知理论范围（BLEU）。","source":"原创","id":"ML-018","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"评估文本摘要质量时，ROUGE指标的主要取向是？","options":{"C":"召回率（参考摘要内容被覆盖的程度）","A":"精确率（生成内容有多精炼）","B":"句长均匀性","D":"词表大小"},"answer":"C","explanation":"ROUGE统计参考摘要中的n-gram被生成摘要召回的比例，侧重查全，与BLEU的精确率取向互补。依据成都赛通知理论范围（ROUGE）。","source":"原创","id":"ML-019","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"ID3决策树算法选择划分特征的依据是？","options":{"D":"信息增益","A":"基尼指数","B":"增益率","C":"卡方统计量"},"answer":"D","explanation":"ID3用信息增益（熵的下降量）选特征；C4.5用增益率纠偏，CART用基尼指数。","source":"原创","id":"ML-020","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"支持向量机（SVM）处理线性不可分数据的关键手段是？","options":{"A":"核技巧把数据映射到高维空间","B":"增大正则化系数到无穷","C":"删除不可分样本","D":"把特征逐一丢弃"},"answer":"A","explanation":"核函数隐式完成高维映射（如RBF核），在高维空间中寻找最大间隔超平面，无需显式计算高维坐标。","source":"原创","id":"ML-021","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"随机森林相对于单棵决策树更稳健，其集成方式属于？","options":{"B":"Bagging（自助采样并行集成，降方差）","A":"Boosting（串行拟合残差，降偏差）","C":"Stacking（元学习器组合）","D":"非集成方法"},"answer":"B","explanation":"随机森林对样本自助采样并对特征随机选择，多树并行投票平均，主要降低方差；Boosting串行纠错，主降偏差。","source":"原创","id":"ML-022","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"GBDT这类Boosting集成的主要作用方向是？","options":{"C":"逐步拟合残差以降低偏差","A":"并行投票以降低方差","B":"增大模型容量以防欠拟合","D":"消除对特征工程的需求"},"answer":"C","explanation":"GBDT每轮新树拟合前面模型的残差，串行累积降低偏差；降方差是Bagging系的特征。","source":"原创","id":"ML-023","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"主成分分析（PCA）降维时保留信息的原则是？","options":{"D":"优先保留方差最大的方向","A":"优先保留方差最小的方向","B":"随机丢弃一半维度","C":"只保留取值为正的特征"},"answer":"D","explanation":"PCA对协方差矩阵做特征分解，投影到方差最大的前若干主成分，使重构误差最小、信息（方差）保留最多。","source":"原创","id":"ML-024","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"L1正则化（Lasso）的典型效果是？","options":{"A":"使部分权重精确为0，产生稀疏与特征选择","B":"让所有权重均匀缩小但不为0","C":"完全防止梯度爆炸","D":"提高学习率"},"answer":"A","explanation":"L1惩罚在坐标轴处形成尖角，最优解易落在轴上使部分权重为0；B是L2（Ridge）的平滑收缩效果。","source":"原创","id":"ML-025","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"F1值是精确率P与召回率R的？","options":{"B":"调和平均：2PR/(P+R)","A":"算术平均：(P+R)/2","C":"几何平均：√(PR)","D":"乘积PR"},"answer":"B","explanation":"调和平均对较小值更敏感，只有P、R都高F1才高，避免短板被平均掩盖。依据成都赛通知理论范围（F1值）。","source":"原创","spot":true,"id":"ML-026","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"ROC曲线的横轴与纵轴分别是？","options":{"C":"假正率FPR与真正率TPR","A":"精确率与召回率","B":"准确率与错误率","D":"特异度与灵敏度倒置"},"answer":"C","explanation":"ROC以FPR=FP/(FP+TN)为横轴、TPR（召回率）为纵轴，随阈值扫描绘制；精确率-召回率构成的是PR曲线。","source":"原创","id":"ML-027","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"中","question":"二分类模型AUC=0.5，通常说明？","options":{"D":"模型接近随机猜测，无判别力","A":"模型完美分类","B":"模型必然有bug","C":"模型过拟合"},"answer":"D","explanation":"AUC衡量随机正样本得分高于随机负样本的概率，0.5等于抛硬币水平；AUC=1才是完美，通常良好的模型在0.8以上。","source":"原创","id":"ML-028","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"CART决策树分类时选择分裂特征的准则（也是sklearn默认）是？","options":{"A":"基尼指数最小化","B":"信息增益最大化","C":"增益率最大化","D":"均方误差最大化"},"answer":"A","explanation":"CART用基尼指数（不纯度）作为分裂准则并支持回归树（用MSE）；信息增益属ID3、增益率属C4.5。","source":"原创","id":"ML-029","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"留一法交叉验证（LOOCV）的特点是？","options":{"B":"每次留1个样本做验证，评估偏差小但计算代价高","A":"只需训练一次模型","C":"随机留出一半数据永远不用","D":"不适用于小数据集"},"answer":"B","explanation":"n个样本训练n次、每次验证1个，几乎用尽全部数据训练（低偏差）但计算量大，适合小数据集而非大数据集。","source":"原创","id":"ML-030","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"在划分数据集之前先用全量数据拟合标准化参数再各自变换，这种做法的问题是？","options":{"C":"测试集统计信息泄漏进训练流程，评估虚高","A":"标准化公式本身错误","B":"模型会立即发散","D":"没有任何问题"},"answer":"C","explanation":"属于典型数据泄漏：正确做法是仅在训练集上fit，再把同一个变换apply到验证/测试集。","source":"原创","id":"ML-031","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"Fβ指标中β>1时的含义是？","options":{"D":"更重视召回率","A":"更重视精确率","B":"两者完全不权衡","C":"指标恒等于1"},"answer":"D","explanation":"β是召回相对精确的权重，β=2（F2）常用于疾病筛查、风险拦截等漏报代价高的场景；β<1偏重精确率。","source":"原创","id":"ML-032","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"混淆矩阵中特异度（Specificity）的计算公式是？","options":{"A":"TN/(TN+FP)","B":"TN/(TN+FN)","C":"TP/(TP+TN)","D":"FP/(FP+TP)"},"answer":"A","explanation":"特异度=真负率，衡量实际负例中被正确识别的比例；C把TP与TN相加无业务含义，D是假发现率。","source":"原创","id":"ML-033","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"AUC的概率学含义是？","options":{"B":"随机取一正一负样本，正样本得分更高的概率","A":"模型准确率的上界","C":"正样本占比","D":"分类错误的平均代价"},"answer":"B","explanation":"AUC等价于正负样本随机配对时模型正确排序的概率，因此它只依赖得分排序、与判定阈值无关。","source":"原创","id":"ML-034","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"语音识别词错误率WER=(S+D+I)/N，其中S、D、I、N分别代表？","options":{"C":"替换数、删除数、插入数、参考词数","A":"正确数、删除数、插入数、总词数","B":"替换数、正确数、插入数、句数","D":"样本数、维度、迭代数、轮数"},"answer":"C","explanation":"WER=（替换+删除+插入）/参考文本词数，因插入可多于参考词，WER理论上可能大于100%。依据成都赛通知理论范围（WER）。","source":"原创","id":"ML-035","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"训练误差持续下降而验证误差先降后升，该模型呈现的问题是？","options":{"D":"过拟合，应早停或加强正则化","A":"欠拟合，应加深加大模型","B":"数据量太大","C":"学习率过小"},"answer":"D","explanation":"训练与验证曲线张口是过拟合的典型信号，早停（在验证误差最低点停止）、正则化、增数据都是对策；欠拟合表现为两条曲线都居高不下。","source":"原创","id":"ML-036","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"软间隔SVM中惩罚系数C取得很大时，模型的倾向是？","options":{"A":"几乎不容忍违规样本，间隔窄、易过拟合","B":"高度容忍违规样本，间隔宽、易欠拟合","C":"自动改用核函数","D":"自动增加特征数"},"answer":"A","explanation":"C是违反间隔的惩罚权重，C大意味着尽力满足每个样本（可能过拟合），C小则允许更多违规、更平滑的边界。","source":"原创","id":"ML-037","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"目标检测中mAP指标的计算基础是？","options":{"B":"各类别PR曲线下面积（AP）的平均","A":"分类准确率的平均","C":"所有框的交并比平均","D":"推理时间的倒数"},"answer":"B","explanation":"先按IoU阈值判定每个类的检测对错得到PR曲线，AP为曲线下面积，mAP再对类别取平均。依据大纲第20条。","source":"原创","id":"ML-038","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"划分训练/验证/测试集时使用分层抽样（stratified split）的目的是？","options":{"C":"保持各子集中类别比例与整体一致","A":"让测试集更大","B":"打乱样本顺序","D":"自动删除少数类"},"answer":"C","explanation":"按标签比例分层抽样可避免小类别在某子集中缺席或过密，使评估更稳定，是不平衡数据划分的标准做法。","source":"原创","id":"ML-039","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"难","question":"癌症筛查场景中，把健康人误判为阳性（FP）与把病人漏判（FN）相比，更应优先压低的是？","options":{"D":"FN（漏诊），应偏重召回率","A":"FP（误诊），应偏重精确率","B":"两者永远同等重要","C":"都不重要"},"answer":"D","explanation":"漏诊延误治疗的代价远高于复检成本，故此类场景以召回率优先（可用F2），风控拦截同理，指标选择要贴合业务代价。","source":"原创","id":"ML-040","domain":"机器学习基础与评估指标","verified":true},{"type":"判断","difficulty":"易","question":"聚类分析属于无监督学习。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"聚类不依赖预先标注的标签，按样本相似性自动成组，是无监督学习的代表任务。","source":"原创","id":"ML-041","domain":"机器学习基础与评估指标","verified":true},{"type":"判断","difficulty":"易","question":"混淆矩阵中，TP（真正例）指实际为正且被预测为正的样本。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"TP/FP/FN/TN是混淆矩阵四象限的基础：TP实际正预测正，FP实际负预测正，FN实际正预测负，TN实际负预测负。","source":"原创","id":"ML-042","domain":"机器学习基础与评估指标","verified":true},{"type":"判断","difficulty":"易","question":"在数据和模型不变的情况下，增加训练数据量通常有助于缓解过拟合。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"更多数据让模型难以死记训练样本，迫使其学习更一般化的规律，是缓解过拟合的有效手段之一。","source":"原创","id":"ML-043","domain":"机器学习基础与评估指标","verified":true},{"type":"判断","difficulty":"中","question":"F1值是精确率与召回率的算术平均。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"F1是调和平均2PR/(P+R)，调和平均惩罚短板；算术平均下P=1、R=0仍得0.5，会严重高估模型。","source":"原创","id":"ML-044","domain":"机器学习基础与评估指标","verified":true},{"type":"判断","difficulty":"中","question":"只要使用了K折交叉验证，模型就完全不会过拟合。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"交叉验证提供更稳健的泛化估计，但过拟合根源在模型复杂度与数据量的匹配，仍需正则化、早停等手段配合。","source":"原创","id":"ML-045","domain":"机器学习基础与评估指标","verified":true},{"type":"判断","difficulty":"中","question":"决策树可以通过剪枝来缓解过拟合。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"预剪枝限制深度/最小样本数，后剪枝合并冗余子树，都是为了控制树复杂度、提升泛化。","source":"原创","id":"ML-046","domain":"机器学习基础与评估指标","verified":true},{"type":"判断","difficulty":"难","question":"ROC-AUC的取值不随分类阈值的移动而变化。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"ROC曲线本身就是遍历全部阈值绘制的，AUC概括整条曲线，因而对单一阈值不敏感，这也是它常用于模型级比较的原因。","source":"原创","id":"ML-047","domain":"机器学习基础与评估指标","verified":true},{"type":"判断","difficulty":"难","question":"欺诈率仅1%的数据集上，把全部样本预测为正常即可获得99%准确率，该模型仍可能毫无实用价值。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"这是准确率悖论：类别不平衡时应看召回率、F1、PR-AUC等指标，99%的准确率可能对应漏掉全部欺诈案件。","source":"原创","id":"ML-048","domain":"机器学习基础与评估指标","verified":true},{"type":"多选","difficulty":"中","question":"下列属于无监督学习算法的有？","options":{"C":"K-means聚类","B":"主成分分析PCA","A":"DBSCAN聚类","D":"逻辑回归"},"answer":"ABC","explanation":"聚类与降维均不需要标签；逻辑回归需要标注标签，属于监督学习。","source":"原创","id":"ML-049","domain":"机器学习基础与评估指标","verified":true},{"type":"多选","difficulty":"中","question":"下列属于集成学习（Ensemble）方法的有？","options":{"C":"随机森林","A":"XGBoost","D":"AdaBoost","B":"支持向量机"},"answer":"ACD","explanation":"随机森林是Bagging代表，AdaBoost与XGBoost属于Boosting家族；SVM是单一模型而非集成方法。","source":"原创","id":"ML-050","domain":"机器学习基础与评估指标","verified":true},{"type":"多选","difficulty":"中","question":"下列有助于缓解过拟合的措施有？","options":{"C":"Dropout","D":"L2正则化","A":"早停（Early Stopping）","B":"进一步增大模型参数量"},"answer":"ACD","explanation":"Dropout、正则化与早停都抑制模型过度记忆训练集；单纯增大参数量通常加剧过拟合。","source":"原创","id":"ML-051","domain":"机器学习基础与评估指标","verified":true},{"type":"多选","difficulty":"中","question":"特征工程的常见内容包括？","options":{"C":"特征构造与组合","D":"特征缩放（标准化/归一化）","B":"特征选择","A":"类别特征的独热编码"},"answer":"ABCD","explanation":"特征工程覆盖从原始数据构造、变换、筛选到编码的全过程，往往比换模型更能提升表格数据任务的效果。依据大纲第17条。","source":"原创","id":"ML-052","domain":"机器学习基础与评估指标","verified":true},{"type":"多选","difficulty":"难","question":"关于评估指标，下列说法正确的有？","options":{"C":"召回率关注漏报（FN），精确率关注误报（FP）","A":"F1在精确率与召回率间取得平衡","D":"AUC对类别不平衡相对稳健","B":"类别极度不平衡时准确率是最可靠的指标"},"answer":"ACD","explanation":"C、A、D为正确辨析；B恰好相反，不平衡场景准确率易失真，应优先F1、PR曲线与召回率。依据成都赛通知理论范围。","source":"原创","id":"ML-053","domain":"机器学习基础与评估指标","verified":true},{"type":"多选","difficulty":"难","question":"关于模型选择与验证，下列做法正确的有？","options":{"B":"测试集只用于最终评估，不参与调参","A":"验证集用于超参数选择与模型比较","C":"数据泄漏会使离线评估虚高","D":"反复根据测试集分数调整模型再重测"},"answer":"ABC","explanation":"D本质是把测试集当验证集用，评估结果随之失效；正确的三分法与防泄漏意识是离线评估可信的前提。","source":"原创","id":"ML-054","domain":"机器学习基础与评估指标","verified":true},{"type":"单选","difficulty":"易","question":"神经网络中引入非线性激活函数的主要目的是？","options":{"A":"使网络能够拟合非线性关系","B":"加快数据读取速度","C":"减少参数总量到零","D":"让输出只能是正数"},"answer":"A","explanation":"没有非线性激活时多层网络等价于单层线性变换；激活函数赋予网络逼近任意非线性函数的能力。","source":"原创","id":"DP-002","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"Sigmoid激活函数的输出取值范围是？","options":{"B":"(0, 1)","A":"(−1, 1)","C":"(0, +∞)","D":"(−∞, +∞)"},"answer":"B","explanation":"Sigmoid把任意实数压缩到0与1之间，适合输出概率；(−1,1)是tanh的值域，(0,+∞)是ReLU的值域。","source":"原创","spot":true,"id":"DP-003","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"ReLU激活函数的数学表达式是？","options":{"C":"max(0, x)","A":"1/(1+e^(−x))","B":"x²","D":"sin(x)"},"answer":"C","explanation":"ReLU即修正线性单元，负半轴置0、正半轴恒等；A是Sigmoid。ReLU计算简单且能缓解梯度消失，是深度网络默认选择之一。","source":"原创","id":"DP-004","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"多分类网络输出层通常使用Softmax，其输出的特点是？","options":{"D":"各类别概率均大于0且总和为1","A":"各输出可以是任意实数","B":"只有最大值保留其余清零","C":"输出按字典序排序"},"answer":"D","explanation":"Softmax对logits指数归一化，输出构成合法概率分布，可与交叉熵损失配套使用；B描述的是argmax取标签的操作。","source":"原创","id":"DP-005","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"均方误差（MSE）损失通常用于哪类任务？","options":{"A":"回归","B":"多分类","C":"目标检测","D":"语音合成"},"answer":"A","explanation":"MSE度量预测值与连续真值的平方偏差，是回归任务的标准损失；分类任务一般配合交叉熵损失。","source":"原创","id":"DP-006","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"分类任务最常用的损失函数是？","options":{"B":"交叉熵损失","A":"余弦相似度","C":"欧氏距离","D":"汉明码校验"},"answer":"B","explanation":"交叉熵衡量预测分布与真实分布的差异，配合Softmax/Sigmoid构成分类标准配置；欧氏距离类损失对应回归。","source":"原创","id":"DP-007","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"反向传播算法的数学本质是？","options":{"C":"利用链式法则逐层计算梯度","A":"随机打乱训练样本","B":"对网络做剪枝压缩","D":"把权重矩阵转置"},"answer":"C","explanation":"反向传播沿计算图从输出到输入应用链式法则高效求损失对各层参数的偏导，是梯度下降在深层网络的实现基础。","source":"原创","id":"DP-008","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"卷积神经网络（CNN）中同一卷积核在整张图上重复使用参数，这一特点称为？","options":{"D":"权值共享","A":"随机初始化","B":"池化","C":"正则化"},"answer":"D","explanation":"权值共享让卷积核在所有空间位置复用同一组参数，大幅减少参数量并赋予平移等变性，是CNN区别于全连接网络的关键。","source":"原创","id":"DP-009","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"池化层（Pooling）在CNN中的主要作用是？","options":{"A":"下采样，压缩特征图尺寸","B":"增加通道数","C":"替换损失函数","D":"生成训练数据"},"answer":"A","explanation":"最大/平均池化对局部区域聚合，缩小特征图、减少计算量并带来一定的平移不变性。","source":"原创","id":"DP-010","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"循环神经网络（RNN）适合处理的数据类型是？","options":{"B":"具有先后顺序的序列数据","A":"完全随机的无序集合","C":"只有两个样本的迷你集","D":"单张灰度图片"},"answer":"B","explanation":"RNN通过隐状态沿时间步传递历史信息，天然建模文本、语音、时间序列等顺序依赖。","source":"原创","id":"DP-011","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"LSTM相对于原始RNN的主要改进是？","options":{"C":"用门控机制缓解长程依赖的梯度消失","A":"彻底取消了梯度计算","B":"把序列倒序输入","D":"删除了隐藏状态"},"answer":"C","explanation":"LSTM以遗忘门、输入门、输出门和细胞状态控制信息流，使远距离梯度得以保留，长序列建模更稳定。","source":"原创","id":"DP-012","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"ResNet的核心创新是？","options":{"D":"残差连接（跳连）结构","A":"取消所有激活函数","B":"只使用一层的网络","C":"把卷积换成全连接"},"answer":"D","explanation":"残差学习让梯度经恒等捷径直达浅层，缓解深层网络的退化问题，使训练上百层成为可能。","source":"原创","id":"DP-013","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"Adam优化器的主要特征是？","options":{"A":"自适应调整每个参数的学习率","B":"完全不需要学习率","C":"只更新第一层参数","D":"把梯度固定为常数"},"answer":"A","explanation":"Adam融合动量与二阶矩估计，为各参数自适应缩放步长，收敛快、对超参不敏感，是深度学习默认优化器之一。","source":"原创","id":"DP-014","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"Tanh激活函数的输出取值范围是？","options":{"B":"(−1, 1)","A":"(0, 1)","C":"(0, +∞)","D":"(−∞, 0)"},"answer":"B","explanation":"tanh是零中心的Sigmoid拉伸版，输出(−1,1)；(0,1)是Sigmoid的值域，零中心特性常使tanh在隐藏层表现更好。","source":"原创","id":"DP-015","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"深度网络中Sigmoid容易导致梯度消失的原因是？","options":{"C":"输入绝对值较大时函数进入饱和区，导数接近0","A":"输出恒为负数","B":"参数量过大溢出","D":"学习率自动归零"},"answer":"C","explanation":"Sigmoid两端饱和，导数最大仅0.25，多层连乘后梯度指数级衰减；这也是ReLU被广泛采用的原因之一。","source":"原创","id":"DP-016","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"ReLU的“神经元死亡”问题指？","options":{"D":"输入长期为负的神经元输出恒0且不再更新","A":"显存不足进程退出","B":"网络层数自动减少","C":"输出超过1被截断"},"answer":"D","explanation":"负半轴梯度为0，若神经元长期接收负输入则权重得不到更新；Leaky ReLU等变体给负区间留小斜率来缓解。","source":"原创","id":"DP-017","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"早期感知机不使用阶跃函数做可训练激活的主要原因是？","options":{"A":"阶跃函数不可导，无法用梯度下降优化","B":"计算量太大","C":"输出范围太大","D":"阶跃函数是非法字符"},"answer":"A","explanation":"阶跃函数除跳变点外导数恒为0，梯度信息完全丢失；Sigmoid等光滑替代使其可微可优化。","source":"原创","id":"DP-018","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"SGD中加入动量（Momentum）的主要作用是？","options":{"B":"累积历史方向加速收敛并抑制震荡","A":"让学习率恒定不变","C":"自动划分数据集","D":"替代损失函数"},"answer":"B","explanation":"动量把历史梯度指数加权平均，在峡谷地形中平滑横向震荡、加速纵向前进，是深度学习优化的常用技巧。","source":"原创","id":"DP-019","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"深网络出现梯度消失的主要诱因是？","options":{"C":"层数深且激活函数饱和区导数小，梯度连乘衰减","A":"数据量太大","B":"标签全是正数","D":"显卡驱动过旧"},"answer":"C","explanation":"链式法则导致各层小导数连乘，深层梯度指数级缩小；换ReLU、残差连接、BatchNorm、门控结构是常见对策。","source":"原创","id":"DP-020","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"训练RNN/LSTM时常用梯度裁剪（gradient clipping），其目的是？","options":{"D":"防止梯度爆炸","A":"防止梯度消失","B":"加快数据加载","C":"减少参数量"},"answer":"D","explanation":"梯度裁剪把超过阈值的梯度整体缩放，抑制长序列连乘导致的爆炸性更新；它不解决梯度消失。","source":"原创","id":"DP-021","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"BatchNorm层受欢迎的主要原因是？","options":{"A":"稳定各层输入分布，允许更大学习率、加快收敛","B":"彻底消除过拟合","C":"使网络无需激活函数","D":"自动生成标注数据"},"answer":"A","explanation":"批量归一化对每小批数据标准化再缩放平移，缓解内部协变量偏移，训练更稳更快，并带有轻微正则化效果。","source":"原创","id":"DP-022","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"输入特征图为28×28，使用3×3卷积核、步长1、填充1，输出特征图尺寸是？","options":{"B":"28×28","A":"26×26","C":"14×14","D":"30×30"},"answer":"B","explanation":"输出尺寸=(W−F+2P)/S+1=(28−3+2)/1+1=28，3×3卷积配padding=1保持尺寸不变，是VGG等网络的惯例。","source":"原创","id":"DP-023","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"最大池化与平均池化的区别是？","options":{"C":"最大池化取窗口内最大值，平均池化取均值","A":"两者完全相同","B":"平均池化只保留边缘","D":"最大池化需要训练参数"},"answer":"C","explanation":"最大池化突出最强激活（更常用），平均池化平滑整体响应；两者都无可训练参数、只做固定聚合。","source":"原创","id":"DP-024","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"卷积层的“感受野”是指？","options":{"D":"输出上一个像素对应的输入区域大小","A":"显卡的显存容量","B":"数据集的图像总数","C":"卷积核的参数个数"},"answer":"D","explanation":"层叠卷积与池化逐步扩大感受野，使深层特征对应原图更大的语义区域；小卷积核堆栈以更少参数获得大感受野。","source":"原创","id":"DP-025","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"LSTM包含的三个门是？","options":{"A":"遗忘门、输入门、输出门","B":"更新门、重置门、控制门","C":"左门、右门、中门","D":"读门、写门、删门"},"answer":"A","explanation":"遗忘门决定细胞态保留多少旧信息，输入门决定写入多少新信息，输出门决定隐状态输出；B中的两门是GRU的结构。","source":"原创","id":"DP-026","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"与LSTM相比，GRU的结构特点是？","options":{"B":"只有更新门和重置门，参数更少训练更快","A":"门数更多更精细","C":"完全没有门控","D":"只能用于图像"},"answer":"B","explanation":"GRU合并了细胞态与隐状态，仅保留更新、重置两门，参数与计算量小于LSTM，中小数据集上常能打平效果。","source":"原创","id":"DP-027","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"Seq2Seq模型引入注意力机制的主要动机是？","options":{"C":"突破固定长度上下文向量的信息瓶颈","A":"减少词典大小","B":"取消解码器","D":"把任务改为分类"},"answer":"C","explanation":"编码器把整句压成一个向量易丢失长句信息，注意力让解码器每步动态回看相关源位置，该思想随后演化出Transformer。","source":"原创","id":"DP-028","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"中","question":"Transformer必须使用位置编码的原因是？","options":{"D":"自注意力本身对输入顺序不敏感，需注入位置信息","A":"为了压缩词表","B":"为了让输出只能是中文","C":"为了减少层数"},"answer":"D","explanation":"自注意力是集合式操作，打乱输入顺序结果不变（置换不变）；位置编码把次序信息显式加进表示，序列建模才成立。","source":"原创","id":"DP-029","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"单层感知机无法解决的经典问题是？","options":{"A":"异或（XOR）问题","B":"与（AND）问题","C":"或（OR）问题","D":"非（NOT）问题"},"answer":"A","explanation":"XOR的类别在平面上线性不可分，单层感知机只能画一条直线；多层网络（含隐藏层）才能拟合，这推动了多层网络与反向传播的发展。","source":"原创","id":"DP-030","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"输入特征图尺寸28×28，用5×5卷积核、步长1、无填充，输出尺寸是？","options":{"B":"24×24","A":"26×26","C":"28×28","D":"23×23"},"answer":"B","explanation":"输出=(W−F+2P)/S+1=(28−5+0)/1+1=24，无填充时每侧损失(F−1)/2=2个像素。","source":"原创","spot":true,"id":"DP-031","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"多头注意力（Multi-Head Attention）将Q、K、V拆分到多个子空间的主要收益是？","options":{"C":"在不同表示子空间并行学习不同的关注模式","A":"把序列长度减半","B":"完全消除计算量","D":"免去Softmax"},"answer":"C","explanation":"各头独立做注意力后拼接，有的头关注句法、有的关注指代等，等价于多次加权聚合，代价是维度切分而非计算消失。","source":"原创","id":"DP-032","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"缩放点积注意力中除以√dk的作用是？","options":{"D":"防止点积过大使Softmax进入饱和、梯度变小","A":"把向量归一化到单位球面","B":"减少参数量","C":"让输出只能是整数"},"answer":"D","explanation":"维度大时点积方差随之增大，Softmax趋近独热分布、梯度消失；按√dk缩放使方差稳定，训练更平稳。","source":"原创","id":"DP-033","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"神经网络权重全部初始化为0会导致？","options":{"A":"同层神经元对称，学到完全相同的特征","B":"训练一定立刻收敛到最优","C":"前向传播报错无法计算","D":"损失自动变为零"},"answer":"A","explanation":"全零初始化使同层神经元梯度相同、更新同步，网络退化为每层一个有效单元；需随机打破对称（Xavier/He初始化）。","source":"原创","id":"DP-034","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"BatchNorm在推理（inference）阶段使用的统计量是？","options":{"B":"训练期累积的移动平均统计量","A":"当前输入批次的实时均值方差","C":"全零向量","D":"随机采样统计量"},"answer":"B","explanation":"推理可能逐条预测且需结果确定，BN改用训练期指数移动平均的均值方差，这也是train/eval模式切换的意义之一。","source":"原创","id":"DP-035","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"自注意力的计算量随序列长度n的增长方式是？","options":{"C":"约O(n²)","A":"约O(n)","B":"约O(log n)","D":"与n无关"},"answer":"C","explanation":"任意两位置两两计算注意力得分构成n×n矩阵，长序列的显存与计算开销平方级增长，是长上下文建模的核心瓶颈。","source":"原创","id":"DP-036","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"大模型训练常用warmup（学习率预热）的原因是？","options":{"D":"训练初期梯度不稳，先小学习率再升到目标值更平稳","A":"让学习率始终为零","B":"加快数据加载","C":"省去优化器状态"},"answer":"D","explanation":"起步阶段参数与统计量剧烈波动，直接用大学习率易发散；warmup线性升温后再按调度衰减，是Transformer训练标配。","source":"原创","id":"DP-037","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"AdamW相对于Adam的关键改动是？","options":{"A":"将权重衰减从梯度项中解耦，正则化更正确","B":"彻底删除动量项","C":"固定所有学习率不变","D":"只适用于RNN"},"answer":"A","explanation":"Adam把L2项混入梯度会被自适应缩放，削弱正则效果；AdamW直接对权重做衰减，是当前大模型训练的主流优化器。","source":"原创","id":"DP-038","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"关于KL散度，正确的说法是？","options":{"B":"衡量两个分布的差异且不对称","A":"是对称的距离度量","C":"取值可以为负数","D":"与交叉熵毫无关系"},"answer":"B","explanation":"KL(P||Q)≠KL(Q||P)，不满足距离对称性；交叉熵=熵+KL，最小化交叉熵即最小化KL；KL非负。","source":"原创","id":"DP-039","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"知识蒸馏中把软目标的温度参数T调高的效果是？","options":{"C":"软化输出分布，暴露类别间相似度等暗知识","A":"让分布更加尖锐接近独热","B":"直接删除教师模型","D":"把输出变为标量"},"answer":"C","explanation":"高温使softmax输出更平滑，携带教师对“易混淆类”的判断信息，学生据此学到的软标签比硬标签信息量更大。","source":"原创","id":"DP-040","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"难","question":"训练中损失突然变为NaN，最不可能的原因是？","options":{"D":"训练数据里混入适量中文标点","A":"学习率过大导致数值爆炸","B":"出现了除以零或log(0)","C":"梯度爆炸未加裁剪"},"answer":"D","explanation":"常规标点不会直接造成数值异常；NaN多源于学习率过大、log/除零未加保护、梯度爆炸或脏数据中的异常值。","source":"原创","id":"DP-041","domain":"深度学习与神经网络","verified":true},{"type":"判断","difficulty":"易","question":"多层感知机（MLP）由全连接层堆叠而成。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"MLP即全连接神经网络，是深度学习最基本的网络形态，CNN、Transformer等可视为在其基础上的结构创新。","source":"原创","id":"DP-042","domain":"深度学习与神经网络","verified":true},{"type":"判断","difficulty":"易","question":"Softmax输出向量各分量之和为1。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"Softmax按指数归一化，输出是一组合法概率，总和为1，因此可直接解释为各类别概率。","source":"原创","id":"DP-043","domain":"深度学习与神经网络","verified":true},{"type":"判断","difficulty":"中","question":"网络层数越深，测试集性能一定越好。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"过深且无残差等设计会出现退化与过拟合，测试性能不增反降；深度需与数据量、结构和正则手段匹配。","source":"原创","id":"DP-044","domain":"深度学习与神经网络","verified":true},{"type":"判断","difficulty":"中","question":"Dropout在模型推理（预测）阶段也应对神经元做随机丢弃。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"Dropout只在训练时随机失活以防止共适应；推理时使用全部神经元（PyTorch在eval模式下自动关闭dropout）。","source":"原创","id":"DP-045","domain":"深度学习与神经网络","verified":true},{"type":"判断","difficulty":"中","question":"最大池化层本身没有可训练参数。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"池化只是固定的区域聚合操作，仅含窗口大小、步长等超参数，不含权重；卷积层才有可训练的核参数。","source":"原创","id":"DP-046","domain":"深度学习与神经网络","verified":true},{"type":"判断","difficulty":"中","question":"原始Transformer完全基于注意力与前馈结构，不包含卷积和循环结构。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"Transformer以多头自注意力+前馈网络堆叠，抛弃卷积与循环，依靠位置编码感知顺序，换来大规模并行训练能力。","source":"原创","id":"DP-047","domain":"深度学习与神经网络","verified":true},{"type":"判断","difficulty":"难","question":"BatchNorm在推理阶段应使用当前这一批输入数据的均值和方差。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"推理阶段使用训练期保存的移动平均统计量，保证单样本预测结果确定且与批大小无关。","source":"原创","id":"DP-048","domain":"深度学习与神经网络","verified":true},{"type":"判断","difficulty":"难","question":"Sigmoid函数导数的最大值为0.25。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"σ'(x)=σ(x)(1−σ(x))，在x=0处取得最大值0.25；多层连乘后梯度至多按(0.25)^层数衰减，这正是饱和激活引发梯度消失的定量解释。","source":"原创","id":"DP-049","domain":"深度学习与神经网络","verified":true},{"type":"多选","difficulty":"中","question":"下列属于卷积神经网络（CNN）结构特点的有？","options":{"D":"局部连接","A":"权值共享","B":"池化降采样","C":"沿时间步循环传递隐状态"},"answer":"ABD","explanation":"局部连接、权值共享与池化是CNN三大标志；循环隐状态是RNN的特征，与CNN正交。","source":"原创","id":"DP-050","domain":"深度学习与神经网络","verified":true},{"type":"多选","difficulty":"中","question":"有助于缓解梯度消失的手段包括？","options":{"B":"使用ReLU等非饱和激活函数","D":"引入残差连接","C":"使用LSTM等门控结构","A":"把学习率调到极大"},"answer":"BCD","explanation":"非饱和激活、恒等捷径与门控都在改善深层梯度流动；极大学习率引发震荡发散而非缓解梯度消失。","source":"原创","id":"DP-051","domain":"深度学习与神经网络","verified":true},{"type":"多选","difficulty":"中","question":"下列属于模型压缩/轻量化方法的有？","options":{"C":"量化（如INT8）","B":"剪枝","A":"知识蒸馏","D":"增加网络层数"},"answer":"ABC","explanation":"量化降数值精度、剪枝去冗余结构、蒸馏以小模型学大模型，都是降低存储与推理开销的常用手段。依据大纲第25条。","source":"原创","id":"DP-052","domain":"深度学习与神经网络","verified":true},{"type":"多选","difficulty":"难","question":"Transformer编码器层包含的组件有？","options":{"D":"多头自注意力子层","B":"逐位置前馈网络","C":"层归一化与残差连接","A":"反卷积上采样层"},"answer":"BCD","explanation":"标准编码器层=多头自注意力+FFN，各子
