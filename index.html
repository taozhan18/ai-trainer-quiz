层配LayerNorm与残差；反卷积用于图像分割的解码上采样，与Transformer无关。","source":"原创","id":"DP-053","domain":"深度学习与神经网络","verified":true},{"type":"多选","difficulty":"难","question":"关于优化器，下列说法正确的有？","options":{"D":"Adam为每个参数自适应调整学习率","C":"SGD加动量可减小震荡加速收敛","B":"学习率过大可能导致损失发散","A":"Adam在任何任务上都必然优于SGD"},"answer":"BCD","explanation":"D、C、B均为准确表述；A过于绝对，精调的SGD（含动量）在不少视觉任务上仍能追平或超过Adam。","source":"原创","id":"DP-054","domain":"深度学习与神经网络","verified":true},{"type":"单选","difficulty":"易","question":"中文分词是中文NLP的基础步骤，其必要性源于中文文本？","options":{"A":"词与词之间没有空格等天然分隔符","B":"只能用拼音表示","C":"字符总数超过内存限制","D":"不允许使用标点符号"},"answer":"A","explanation":"英文以空格分词，中文连续书写需先切词（如jieba）才能进行词级统计与序列标注，这是中文NLP特有的基础环节。","source":"原创","id":"NLP-002","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"命名实体识别（NER）任务要识别的对象通常是？","options":{"B":"人名、地名、机构名等实体","A":"所有形容词","C":"文档的创建时间戳","D":"标点符号的编码值"},"answer":"B","explanation":"NER从文本中定位并分类命名实体（人名、地名、机构名、时间、疾病等），是信息抽取的基础任务，常以BIO标注。","source":"原创","id":"NLP-003","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"情感分析在任务形式上通常建模为？","options":{"C":"文本分类任务","A":"目标检测任务","B":"语音合成任务","D":"图像分割任务"},"answer":"C","explanation":"判断评论的情感极性（正面/负面/中性）即对文本打离散标签，也可细化为评分预测或方面级情感分析。","source":"原创","id":"NLP-004","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"直接从原文中抽取句子组成摘要的方式称为？","options":{"D":"抽取式摘要","A":"生成式摘要","B":"关键词编码","C":"语音转写"},"answer":"D","explanation":"抽取式摘要挑选原文重要句拼接，忠实但可能不通顺；生成式摘要由模型改写生成新句子，更接近人写摘要。","source":"原创","id":"NLP-005","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"BERT的预训练采用的双向上下文建模方式使其特别适合？","options":{"A":"文本理解类任务","B":"自回归文本生成","C":"图像渲染","D":"音频降噪"},"answer":"A","explanation":"BERT通过掩码语言模型同时看到左右上下文，在分类、抽取等理解任务上表现强；自回归生成是GPT式单向模型的强项。","source":"原创","id":"NLP-006","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"GPT系列模型的预训练目标是？","options":{"B":"根据前文预测下一个词","A":"恢复被遮挡的图像块","C":"对音频做降噪","D":"同时预测所有输出词"},"answer":"B","explanation":"GPT是解码器式自回归语言模型，逐词根据已生成内容预测下一个token，这种目标天然支撑文本生成。","source":"原创","id":"NLP-007","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"“先在大规模无标注语料上预训练，再在下游任务上微调”的范式称为？","options":{"C":"预训练-微调范式","A":"纯规则范式","B":"单遍扫描范式","D":"人工标注范式"},"answer":"C","explanation":"预训练学到通用语言表示，微调以少量标注数据适配具体任务，大幅降低下游任务的数据与训练成本。依据大纲第2条。","source":"原创","id":"NLP-008","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"SFT（监督微调/指令微调）使用的数据形式通常是？","options":{"D":"指令-回答样本对","A":"无任何标注的网页","B":"仅含错别字的语料","C":"图像坐标框"},"answer":"D","explanation":"SFT以（instruction，output）等指令-答案对训练模型遵循人类指令，使基座模型转变为对话/任务助手。依据省赛技术文件实操模块D。","source":"原创","id":"NLP-009","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"LoRA微调的做法是？","options":{"A":"冻结基座模型权重，仅训练注入的低秩矩阵","B":"更新模型全部参数","C":"只修改分词器词表","D":"把模型转为ONNX格式"},"answer":"A","explanation":"LoRA在冻结的基座权重旁注入成对的低秩可训练矩阵，仅训练这些新增参数，以极小可训练量逼近全量微调效果。","source":"原创","spot":true,"id":"NLP-010","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"AI Agent（智能体）区别于纯对话大模型应用的关键能力是？","options":{"B":"能自主规划并调用工具完成多步任务","A":"只能回答单个问题","C":"仅支持中文对话","D":"必须离线运行"},"answer":"B","explanation":"Agent以任务规划、工具调用、记忆与反思构成行动闭环，能执行多步骤任务；纯问答应用只做单轮应答。依据大纲第3条。","source":"原创","id":"NLP-011","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"思维链提示（Chain-of-Thought）的做法是？","options":{"C":"引导模型输出逐步推理过程再给最终答案","A":"把文本加密后输入","B":"随机打乱题目顺序","D":"仅允许模型回答是或否"},"answer":"C","explanation":"通过示例或指令让模型显式写出中间推理步骤，可显著提升数学、逻辑等复杂任务的准确率。依据大纲第36条。","source":"原创","id":"NLP-012","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"解码时调高温度（temperature）参数的效果是？","options":{"D":"输出分布更平坦，生成更多样随机","A":"输出永远固定为同一句","B":"模型参数量增大","C":"上下文窗口变长"},"answer":"D","explanation":"温度对logits除以T再softmax，T越高分布越平滑、多样性越强；T趋近0则近似贪心解码，输出确定而单一。","source":"原创","id":"NLP-013","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"检索增强生成（RAG）的基本流程是？","options":{"A":"先从知识库检索相关内容，再交给大模型生成答案","B":"先随机生成再手工检索","C":"只检索不生成直接返回链接","D":"把问题翻译成英文后训练"},"answer":"A","explanation":"RAG把外挂知识检索与模型生成结合：文档切分嵌入入库→按问题召回→拼接提示生成，缓解幻觉与知识时效问题。依据大纲第4、38条。","source":"原创","id":"NLP-014","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"C-Eval是面向哪类语言的评测基准？","options":{"B":"中文综合能力","A":"仅英文数学","C":"日文语音","D":"代码安全"},"answer":"B","explanation":"C-Eval覆盖中学到大学多学科的中文评测集；MMLU是英文多任务基准，两者均在大纲第20条列明。","source":"原创","spot":true,"id":"NLP-015","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"jieba在NLP工程中的典型用途是？","options":{"C":"中文分词","A":"英文拼写纠错","B":"图像去雾","D":"数据库迁移"},"answer":"C","explanation":"jieba是国内常用的中文分词库，支持精确/全模式与自定义词典，是中文文本预处理的基础工具。","source":"原创","id":"NLP-016","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"依存句法分析（Dependency Parsing）的输出是？","options":{"D":"词与词之间的语法依赖关系","A":"每个词的情感极性","B":"段落的主题聚类","C":"音频的音高轨迹"},"answer":"D","explanation":"依存分析给出句子中词语间的修饰与支配关系（如主谓、动宾），常以树结构表示，服务于深层语言理解。","source":"原创","id":"NLP-017","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"与稠密词向量相比，one-hot表示的主要缺陷是？","options":{"A":"维度高且稀疏，无法表达词间相似度","B":"训练速度太快","C":"只能表示英文","D":"必须依赖GPU"},"answer":"A","explanation":"one-hot把每个词编码为仅一位为1的高维向量，任意两词正交、语义距离无从比较；词向量（Word2Vec等）以稠密低维空间承载语义相似性。","source":"原创","id":"NLP-018","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"Word2Vec的两种经典架构是？","options":{"B":"CBOW与Skip-gram","A":"BERT与GPT","C":"LSTM与GRU","D":"TF与IDF"},"answer":"B","explanation":"CBOW由上下文预测中心词，Skip-gram由中心词预测上下文，两者都从共现中习得词向量；Skip-gram对低频词更友好。","source":"原创","id":"NLP-019","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"TF-IDF中IDF部分的作用是？","options":{"C":"压低到处出现的常见词权重","A":"提高停用词权重","B":"统计句长","D":"给图片打分"},"answer":"C","explanation":"IDF=log(总文档数/含该词文档数)，“的”“是”等广泛出现的词IDF趋近0，从而使关键词凸显，弥补纯词频的偏差。","source":"原创","id":"NLP-020","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"基于情感词典做情感分析的基本原理是？","options":{"D":"匹配词典中的极性词并加权汇总得分","A":"训练一个大型Transformer","B":"把文本倒序输出","C":"统计字符笔画数"},"answer":"D","explanation":"词典法维护正面/负面词表并考虑程度副词、否定词修正，无需训练即可给出情感倾向，是轻量可解释的经典方案。","source":"原创","id":"NLP-021","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"BERT的预训练任务之一是掩码语言模型（MLM），其做法是？","options":{"A":"随机遮住部分词让模型根据上下文还原","B":"按顺序预测下一个词","C":"翻译整段文本","D":"给段落打情感标签"},"answer":"A","explanation":"MLM随机掩盖约15%的token，由双向上下文预测被掩词，配合下一句预测（NSP）共同完成预训练。","source":"原创","id":"NLP-022","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"自回归语言模型生成文本的方式是？","options":{"B":"每次基于已生成内容预测下一个token","A":"一次并行输出全部token","C":"先输出后半句再补前半句","D":"从文章末尾逆向生成"},"answer":"B","explanation":"自回归逐token条件生成（P(x_t|x_<t)），这与BERT的掩码还原不同，也解释了生成速度与KV Cache优化的关系。","source":"原创","id":"NLP-023","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"关于BERT与GPT的定位差异，正确的概括是？","options":{"C":"BERT双向编码擅长理解，GPT单向解码擅长生成","A":"BERT只能生成不能理解","B":"GPT只能理解不能生成","D":"两者结构完全一致"},"answer":"C","explanation":"BERT是编码器式双向模型，适合分类、抽取等理解任务；GPT是解码器式自回归模型，适合开放生成，二者构成预训练模型的两大路线。","source":"原创","id":"NLP-024","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"RLHF的经典三阶段流程是？","options":{"D":"SFT→训练奖励模型→PPO强化学习优化","A":"预训练→量化→部署","B":"检索→重排→生成","C":"标注→清洗→入库"},"answer":"D","explanation":"先监督微调获得基础对话能力，再由人工偏好数据训练奖励模型，最后用PPO等算法对齐人类偏好。依据大纲第1条。","source":"原创","id":"NLP-025","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"DPO与RLHF的关键区别是？","options":{"A":"DPO直接从偏好数据优化策略，无需单独训练奖励模型","B":"DPO必须先训练奖励模型","C":"DPO只适用于图像","D":"DPO不使用任何数据"},"answer":"A","explanation":"DPO把奖励模型与强化学习两步合为直接偏好优化目标，简化流程、降低训练不稳定性。依据成都赛通知实操范围（偏好对齐）。","source":"原创","spot":true,"id":"NLP-026","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"top-p（核采样）采样的含义是？","options":{"B":"从累积概率达到p的最小词集合中采样","A":"只取概率最高的p个词","C":"把温度固定为p","D":"每p个token截断一次"},"answer":"B","explanation":"核采样动态保留累积概率质量达p的候选集再随机采样，长尾低质词被自动剪除，兼顾多样性与质量，与top-k（固定个数）不同；配合重复惩罚（repetition penalty）还可抑制复读。","source":"原创","id":"NLP-027","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"缓解大模型幻觉的有效手段包括？","options":{"C":"接入RAG提供可溯源证据并做事实校验","A":"把温度固定为100","B":"删除所有训练数据","D":"只允许模型输出单字"},"answer":"C","explanation":"RAG引入外部事实约束生成并结合事后校验、引用来源是主流缓解方案；极端解码参数或限制输出只会劣化可用性。","source":"原创","id":"NLP-028","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"MCP（Model Context Protocol）解决的问题是？","options":{"D":"以标准协议让大模型统一连接外部工具与数据源","A":"压缩模型权重","B":"给图像加注水印","C":"替代数据库索引"},"answer":"D","explanation":"MCP把模型与工具/上下文源的接入方式标准化，避免每个应用重复写胶水代码，是Agent工具生态的连接层。依据大纲第23条。","source":"原创","id":"NLP-029","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"RAG检索后引入重排序（Rerank）环节的目的是？","options":{"A":"用更精细的模型对召回文档精排提升相关性","B":"把文档按字数排序","C":"删除所有中文文档","D":"替代向量检索"},"answer":"A","explanation":"召回阶段追求高召回率（粗筛），重排用交叉编码器等精模型对query-doc细粒度打分重排，显著改善送入生成的证据质量。依据大纲第38条。","source":"原创","id":"NLP-030","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"中","question":"把训练好的模型导出为ONNX或GGUF格式的主要目的是？","options":{"B":"便于跨部署环境推理与量化加速","A":"增大模型体积","C":"防止任何人运行该模型","D":"转换成Word文档"},"answer":"B","explanation":"ONNX面向通用推理引擎跨框架部署，GGUF是llama.cpp等本地推理生态的量化格式；两者都是省赛实操模块B的考核点。","source":"原创","id":"NLP-031","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"BERT输入序列首位的[CLS]标记的典型用途是？","options":{"C":"其最终隐向量作为整句表示用于分类","A":"表示句子的最后一个字","B":"标记文本语言种类","D":"存储学习率数值"},"answer":"C","explanation":"预训练中[CLS]聚合全句信息，微调时取其输出接分类头，是句级任务的聚合位置；[SEP]负责分隔句对。","source":"原创","id":"NLP-032","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"SimPO与多数偏好优化方法相比的显著特点是？","options":{"D":"不依赖参考模型，用长度归一化奖励直接优化","A":"必须加载两个参考模型","B":"只能用于图像生成","C":"完全不需要偏好数据"},"answer":"D","explanation":"SimPO在DPO基础上移除参考模型，以内置的序列长度归一化奖励简化训练、降低显存；它仍需要偏好数据，C错误。依据成都赛通知实操范围（SimPO）。","source":"原创","id":"NLP-033","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"KTO对偏好数据的独特要求是？","options":{"A":"只需要好/坏二值反馈，无需成对偏好样本","B":"必须成对标注chosen与rejected","C":"只能使用英文语料","D":"数据必须全部为正面"},"answer":"A","explanation":"KTO基于前景理论的不对称损失，直接利用点赞/点踩这类二元信号，降低了偏好数据构造门槛；成对要求是DPO式方法的特征。依据成都赛通知实操范围（KTO）。","source":"原创","id":"NLP-034","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"ORPO训练方式的特点是？","options":{"B":"把偏好拒绝信号并入单阶段SFT训练，无需单独的对齐阶段","A":"必须严格遵循预训练、奖励建模、强化学习三阶段","C":"只适用于图像分类等判别式任务","D":"训练过程完全不使用任何损失函数"},"answer":"B","explanation":"ORPO以优势比（Odds Ratio）在监督微调中同步施加偏好惩罚，省去参考模型与两阶段流程。依据成都赛通知实操范围（ORPO）。","source":"原创","id":"NLP-035","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"RAG中混合检索（向量检索+BM25关键词检索）的价值是？","options":{"C":"语义匹配与精确匹配互补，提升整体召回质量","A":"让系统运行更慢","B":"完全取消向量库","D":"仅对英文有效"},"answer":"C","explanation":"向量检索擅长语义相似但可能漏掉专有名词与编号，关键词检索精确匹配强，两路召回融合（再Rerank）取长补短。依据大纲第38条（混合检索策略）。","source":"原创","id":"NLP-036","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"用大模型当裁判（LLM-as-a-Judge）自动评估生成质量时，主要风险是？","options":{"D":"裁判模型的偏好偏差与位置偏差影响评分公正性","A":"评估速度必然慢于人工","B":"只能评估英文","C":"必须联网充值"},"answer":"D","explanation":"自动评估存在偏好/位置/长度等系统性偏差，需校准提示、交换顺序、抽样人工复核加以控制。依据大纲第20条（自动化评估）。","source":"原创","id":"NLP-037","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"KV Cache能加速自回归生成的原理是？","options":{"A":"缓存已算过的键值向量，避免每步重算历史注意力","B":"把模型层数减半","C":"删除注意力机制","D":"把词表压缩为一个词"},"answer":"A","explanation":"每生成一个token只需计算新query，历史K、V直接读缓存，把每步复杂度从全序列重算降为增量计算，代价是显存占用增大。","source":"原创","id":"NLP-038","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"RAG文档分块（chunking）大小的基本权衡是？","options":{"B":"块大语义完整但检索粒度粗，块小检索准但上下文碎","A":"块越大检索越准","C":"块越小语义越完整","D":"分块大小不影响效果"},"answer":"B","explanation":"分块需在语义完整性与检索单元精度间折中，并配合重叠（overlap）缓解边界截断，是RAG工程化的关键调优点。依据大纲第38条。","source":"原创","id":"NLP-039","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"约束大模型输出合法JSON的可行做法是？","options":{"C":"使用JSON模式或在解码时做语法约束解码","A":"把温度设为负数","B":"在提示词里写“必须输出JSON”即可百分百保证","D":"删除分词器"},"answer":"C","explanation":"接口的JSON模式、结构化输出（schema约束）或受约束解码从机制上保证格式合法；仅靠提示词要求无法确保每次成功，B过于绝对。","source":"原创","id":"NLP-040","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"评测大模型前需检查测试集是否混入训练语料，主要为了防止？","options":{"D":"数据污染导致评测分数虚高","A":"显卡过热","B":"分词器报错","C":"下载速度变慢"},"answer":"D","explanation":"见过答案的题目测不出泛化能力，去重与污染检测（n-gram重叠等）是基准评测可信的前提。","source":"原创","id":"NLP-041","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"DPO训练所需的偏好数据对（preference pair）通常包含？","options":{"A":"同一提示下被接受的回答与被拒绝的回答","B":"两条互不相关的新闻","C":"一张图片及其缩略图","D":"模型的权重与梯度"},"answer":"A","explanation":"偏好对=（prompt，chosen，rejected），模型通过拉大两者相对概率学习人类偏好，这是DPO/KTO类对齐方法的数据基础。","source":"原创","id":"NLP-042","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"ReAct范式让Agent交替进行的两个环节是？","options":{"B":"推理（Thought）与行动（Action/观察）","A":"对输入加密与对输出解密","C":"模型训练与权重量化","D":"机器翻译与文本摘要"},"answer":"B","explanation":"ReAct以“思考→行动→观察”循环驱动工具调用，把链式推理与外部反馈结合，是Agent工作流的主流骨架。依据大纲第23条。","source":"原创","id":"NLP-043","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"用LangGraph相对单链LangChain构建Agent的主要增益是？","options":{"C":"以状态图表达带分支、循环与人工介入的多步流程","A":"完全不需要提示词","B":"自动生成训练数据","D":"免去了所有API调用"},"answer":"C","explanation":"LangGraph把流程显式建为图，支持条件边、环与检查点，适合多步骤、可回溯的智能体编排。依据大纲第23条（LangChain、LangGraph）。","source":"原创","id":"NLP-044","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"难","question":"post-pretrain（继续预训练）与SFT的区别是？","options":{"D":"前者用海量无标注领域文本继续预训练，后者用指令答案对学指令遵循","A":"前者用指令数据后者用原始文本","B":"两者是完全相同的训练流程","C":"前者不需要任何训练数据即可完成"},"answer":"D","explanation":"post-pretrain注入领域知识（行业大模型），SFT塑造遵循指令的行为；两者先后配合使用。依据成都赛通知实操范围。","source":"原创","id":"NLP-045","domain":"NLP与大模型","verified":true},{"type":"判断","difficulty":"易","question":"大模型的上下文窗口只限制输出长度，不限制输入文本长度。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"上下文窗口以token计，提示输入与生成输出共享该额度；超长输入会被截断，长文档需分块、摘要或检索注入。","source":"原创","id":"NLP-046","domain":"NLP与大模型","verified":true},{"type":"判断","difficulty":"易","question":"提示词中给出明确、具体的输出要求，通常比模糊表述效果更好。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"明确的任务、格式与约束减少模型自由发挥空间，是提示工程的基本原则，配合few-shot示例效果更稳。依据大纲第47条。","source":"原创","id":"NLP-047","domain":"NLP与大模型","verified":true},{"type":"判断","difficulty":"易","question":"few-shot提示需要在提示词中为模型提供少量示例。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"few-shot即“给几个例子让模型模仿”，示例质量与格式一致性直接影响效果；zero-shot则只下指令不给示例。","source":"原创","id":"NLP-048","domain":"NLP与大模型","verified":true},{"type":"判断","difficulty":"中","question":"LoRA微调会同步更新基座大模型的全部参数。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"LoRA冻结基座权重，只训练注入的低秩矩阵，这正是其省显存、可切换任务适配器的原因。","source":"原创","id":"NLP-049","domain":"NLP与大模型","verified":true},{"type":"判断","difficulty":"中","question":"token与汉字或英文单词是一一对应的关系。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"分词器（如BPE）常把词拆成子词或字节片段，一个token可能是一个词、半个词或单个字符，长度并不固定对应。","source":"原创","id":"NLP-050","domain":"NLP与大模型","verified":true},{"type":"判断","difficulty":"中","question":"提示词模板一经编写就无需再评估和迭代。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"提示工程需要建立评测集持续对比不同版本的效果并迭代优化，模型或数据变化都要求重新评估。依据大纲第36条。","source":"原创","id":"NLP-051","domain":"NLP与大模型","verified":true},{"type":"判断","difficulty":"中","question":"RAG能缓解模型知识过时的问题。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"RAG把时效性知识外置到可更新的知识库，检索后注入上下文，无需重训模型即可获取最新信息。","source":"原创","id":"NLP-052","domain":"NLP与大模型","verified":true},{"type":"判断","difficulty":"难","question":"只要不断增大模型参数量，幻觉问题就能被完全消除。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"规模提升可减少部分事实错误但无法根除幻觉，还需RAG、事实校验、对齐与引用溯源等工程手段组合治理。","source":"原创","id":"NLP-053","domain":"NLP与大模型","verified":true},{"type":"判断","difficulty":"难","question":"Agent的记忆机制只包含当前对话的短期记忆。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"完整的Agent记忆设计通常包含短期上下文记忆与外部长期记忆（向量库等），另有工作记忆式的中间结果缓存。","source":"原创","id":"NLP-054","domain":"NLP与大模型","verified":true},{"type":"判断","difficulty":"难","question":"自回归模型生成第N个token时，以提示与前N−1个已生成token为条件。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"这正是P(x_N|x_<N)的自回归分解，逐词条件生成也说明了上下文长度限制与增量解码优化的由来。","source":"原创","id":"NLP-055","domain":"NLP与大模型","verified":true},{"type":"多选","difficulty":"易","question":"下列属于自然语言处理（NLP）任务的有？","options":{"A":"中文分词","B":"情感分析","D":"机器翻译","C":"文本摘要"},"answer":"ABCD","explanation":"四者均为大纲与成都赛通知明确列出的NLP范围；它们分别属于基础处理、分类、生成与压缩型任务。","source":"原创","id":"NLP-056","domain":"NLP与大模型","verified":true},{"type":"多选","difficulty":"中","question":"关于BERT与GPT，下列说法正确的有？","options":{"A":"BERT基于Transformer编码器，双向建模","C":"GPT基于Transformer解码器，单向自回归","B":"BERT更适合理解类任务，GPT更适合生成任务","D":"两者的预训练目标完全相同"},"answer":"ABC","explanation":"两者分别代表编码器与解码器路线、预训练目标分别为掩码还原与下一词预测，D错误。","source":"原创","id":"NLP-057","domain":"NLP与大模型","verified":true},{"type":"多选","difficulty":"中","question":"下列属于偏好对齐（对齐人类偏好）方法的有？","options":{"D":"RLHF","B":"DPO","C":"KTO","A":"SimPO"},"answer":"ABCD","explanation":"成都赛通知实操范围明确列出KTO、SimPO、DPO、RLHF（奖励模型）、ORPO五种偏好对齐训练模式，四项均在其中；SFT不属于偏好对齐。","source":"原创","id":"NLP-058","domain":"NLP与大模型","verified":true},{"type":"多选","difficulty":"中","question":"关于LoRA微调，下列说法正确的有？","options":{"C":"冻结基座模型权重，只训练低秩适配矩阵","D":"可显著降低可训练参数量与显存占用","A":"可与量化结合形成QLoRA进一步省资源","B":"必须重新训练基座模型全部参数"},"answer":"ACD","explanation":"C、D、A是LoRA系方法的核心优势，B与其设计初衷相反。","source":"原创","id":"NLP-059","domain":"NLP与大模型","verified":true},{"type":"多选","difficulty":"中","question":"一个典型RAG系统的组成包括？","options":{"A":"文本嵌入模型","B":"向量数据库","D":"检索与重排序模块","C":"决策树分类器"},"answer":"ABD","explanation":"RAG链路=嵌入+向量库+检索（可加重排）+大模型生成；决策树不属于该体系。依据大纲第38条。","source":"原创","id":"NLP-060","domain":"NLP与大模型","verified":true},{"type":"多选","difficulty":"中","question":"下列属于大模型常用评测基准的有？","options":{"B":"MMLU","A":"C-Eval","D":"GSM8K","C":"HumanEval"},"answer":"ABCD","explanation":"MMLU考查英文综合知识，C-Eval面向中文，GSM8K考数学推理，HumanEval考代码生成，均为常见基准。依据大纲第20条。","source":"原创","id":"NLP-061","domain":"NLP与大模型","verified":true},{"type":"多选","difficulty":"难","question":"构建AI Agent的关键技术包括？","options":{"A":"工具调用（Function Calling）","B":"任务规划与分解","D":"记忆机制（短期与长期）","C":"反思与自我修正"},"answer":"ABCD","explanation":"现代Agent以规划、记忆、工具使用、反思四大支柱构建，ReAct等工作流将其串联成可回溯的执行链。依据大纲第3、23条。","source":"原创","id":"NLP-062","domain":"NLP与大模型","verified":true},{"type":"多选","difficulty":"难","question":"下列有助于提升大模型推理（inference）效率的手段有？","options":{"C":"KV Cache","D":"模型量化（如INT8）","A":"动态批处理（continuous batching）","B":"把解码温度参数调得更大"},"answer":"ACD","explanation":"KV Cache减少重复计算，量化降低访存与计算开销，动态批处理提高吞吐（vLLM等引擎的卖点）；温度只影响采样分布与生成质量无关推理速度。","source":"原创","id":"NLP-063","domain":"NLP与大模型","verified":true},{"type":"单选","difficulty":"易","question":"数据清洗环节的总体目标是？","options":{"A":"修复或剔除脏数据，提升数据质量以支撑训练","B":"把数据集变得越大越好","C":"把所有字段加密","D":"删除全部标签"},"answer":"A","explanation":"清洗针对格式错误、噪声、重复与缺失等问题，保证后续特征工程与模型训练建立在可靠数据上。依据大纲第14条。","source":"原创","id":"DATA-001","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"易","question":"pandas中删除完全重复的行所用的方法是？","options":{"B":"drop_duplicates()","A":"dropna()","C":"fillna()","D":"reset_index()"},"answer":"B","explanation":"drop_duplicates()去除整行重复记录，是数据去重的标准操作；dropna处理的是缺失值。","source":"原创","id":"DATA-002","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"易","question":"面对含缺失值的训练数据，下列属于常规处理策略的是？","options":{"C":"删除缺失行或用统计量填充","A":"直接当作正常值训练不管","B":"把整张表所有列删掉","D":"随机改成任意大数"},"answer":"C","explanation":"按缺失比例与机制选择删除、均值/中位数/众数填充、插值或模型预测填充；放任不管会让模型学到伪规律。依据大纲第14条。","source":"原创","id":"DATA-003","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"易","question":"下列符合JSON格式规范的对象写法是？","options":{"D":"{\"name\": \"张三\", \"age\": 25}","A":"{name: '张三', age: 25}","B":"{name => 张三}","C":"[name, age, 张三, 25]"},"answer":"D","explanation":"JSON要求键与字符串使用双引号，键值用冒号分隔；单引号键、箭头符号或裸值数组都不合法。","source":"原创","id":"DATA-004","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"易","question":"JSONL（每行一个JSON）格式在模型训练数据中流行的原因是？","options":{"A":"可逐行流式读写，便于大规模处理与追加","B":"文件必然比JSON小一半","C":"不需要遵守JSON语法","D":"只能存储数字"},"answer":"A","explanation":"每行独立成文使其支持逐行读取、并行分片与增量追加，微调数据集（instruction-input-output）几乎默认采用该格式。依据省赛技术文件实操模块A。","source":"原创","id":"DATA-005","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"易","question":"BIO序列标注体系中，O标记的含义是？","options":{"B":"当前字/词不属于任何命名实体","A":"实体的最后一个字","C":"输出文件","D":"原文字符"},"answer":"B","explanation":"B（Begin）实体开始、I（Inside）实体内部、O（Outside）非实体，BIO是NER任务的标准标注格式。依据成都赛通知理论范围（BIO等标注格式）。","source":"原创","spot":true,"id":"DATA-006","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"易","question":"关系型数据库表中，主键（Primary Key）的作用是？","options":{"C":"唯一标识表中的每一行记录","A":"加密整张表","B":"统计行数","D":"存放图片"},"answer":"C","explanation":"主键取值唯一且非空，是行的身份证，也是被外键引用建立表间关系的依据。","source":"原创","id":"DATA-007","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"易","question":"外键（Foreign Key）的作用是？","options":{"D":"建立两张表之间的引用关联","A":"提高屏幕分辨率","B":"压缩数据体积","C":"给字段改名"},"answer":"D","explanation":"外键指向另一表的主键，保证引用完整性，如订单表的用户ID关联用户表。","source":"原创","id":"DATA-008","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"易","question":"SQL语句中筛选满足条件的行应使用的关键字是？","options":{"A":"WHERE","B":"ORDER BY","C":"GROUP BY","D":"LIMIT"},"answer":"A","explanation":"WHERE指定行级过滤条件；ORDER BY排序、GROUP BY分组、LIMIT限定返回行数。","source":"原创","id":"DATA-009","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"易","question":"SQL中配合GROUP BY使用、用于统计每组记录数的聚合函数是？","options":{"B":"COUNT()","A":"UPPER()","C":"TRIM()","D":"NOW()"},"answer":"B","explanation":"COUNT/SUM/AVG/MAX/MIN是聚合函数，与GROUP BY搭配输出每组的统计结果；其余为普通标量函数。","source":"原创","id":"DATA-010","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"z-score标准化与min-max归一化的区别是？","options":{"C":"前者转为均值0方差1，后者压缩到固定区间","A":"两者完全相同","B":"前者必然输出整数","D":"后者会删除异常值"},"answer":"C","explanation":"z-score=(x−μ)/σ适合近似正态数据且对异常值相对稳健；min-max=(x−min)/(max−min)压到[0,1]但易受极值影响。","source":"原创","id":"DATA-011","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"某列收入数据呈严重右偏且含极端高值，填充其缺失值更稳健的选择是？","options":{"D":"中位数","A":"算术均值","B":"最大值","C":"随机一个正整数"},"answer":"D","explanation":"偏态分布下均值被极端值拉高，中位数对离群不敏感，更能代表典型水平。","source":"原创","id":"DATA-012","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"对数值异常偏大的字段用99分位数封顶替换的处理方式称为？","options":{"A":"盖帽法（缩尾/Winsorize）","B":"独热编码","C":"分桶加密","D":"前向填充"},"answer":"A","explanation":"盖帽法把超出上下分位界的值截断到分位数值，保留样本的同时抑制极端值影响，是风控建模常用手法。","source":"原创","id":"DATA-013","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"BIO序列“B-LOC I-LOC O B-PER”中，连续的B-LOC I-LOC表示？","options":{"B":"一个两字/两词的地名实体","A":"两个独立地名","C":"一个地名加一个人名","D":"被删除的文本"},"answer":"B","explanation":"BIO体系中起始标记开启实体、内部标记续接同一实体的多个单元；出现新的起始标记即开始新实体，故末尾的“B-PER”是另一个人名而非前一个地名的延续。","source":"原创","id":"DATA-014","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"量化多名标注员结果一致程度，最常用的统计量是？","options":{"C":"Cohen's Kappa系数","A":"标准差","B":"众数","D":"欧氏距离"},"answer":"C","explanation":"Kappa扣除随机一致的巧合成分衡量标注一致性（多人场景用Fleiss' Kappa），是标注质量管理的核心指标。依据大纲第15条。","source":"原创","id":"DATA-015","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"标注团队中“黄金数据集”（已审定标准答案的样本）的主要用途是？","options":{"D":"考核标注员质量并校准标注标准","A":"直接上线提供服务","B":"替换生产数据库","C":"加密通信"},"answer":"D","explanation":"把黄金集混入任务即可自动比对计算准确率，用于上岗考核、日常抽检与标准对齐。依据大纲第12条。","source":"原创","id":"DATA-016","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"SQL中HAVING与WHERE的关键区别是？","options":{"A":"HAVING对分组聚合结果过滤，WHERE对原始行过滤","B":"两者作用完全等价，可以互换使用","C":"WHERE只能用于分组后","D":"HAVING子句里不能写任何过滤条件"},"answer":"A","explanation":"执行顺序WHERE在GROUP BY之前，聚合函数尚不可用；要按COUNT/AVG等结果筛选必须用HAVING。","source":"原创","id":"DATA-017","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"LEFT JOIN的查询结果特点是？","options":{"B":"左表全部保留，右表无匹配处填NULL","A":"只返回两表都匹配的行","C":"右表全部保留","D":"随机保留一半行"},"answer":"B","explanation":"左连接以左表为基准，右表缺失补NULL；INNER JOIN才只留交集，右表全保留的是RIGHT JOIN。","source":"原创","id":"DATA-018","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"SQL的ORDER BY score DESC输出的顺序是？","options":{"C":"按score从高到低","A":"按score从低到高","B":"按字典序","D":"随机顺序"},"answer":"C","explanation":"DESC降序、ASC升序（默认），排行榜类查询的常用组合。","source":"原创","id":"DATA-019","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"日志类海量半结构化存储更适合选用的数据库类型是？","options":{"D":"文档型NoSQL（如MongoDB）","A":"关系型MySQL","B":"小型SQLite","C":"Excel表格"},"answer":"D","explanation":"文档库模式灵活、水平扩展好，适合结构多变的海量日志；强事务的结构化业务数据仍首选关系型库。","source":"原创","id":"DATA-020","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"下列属于文本数据增强方法的是？","options":{"A":"同义改写与回译（翻译后再翻回）","B":"图像左右翻转","C":"音频变速","D":"视频抽帧"},"answer":"A","explanation":"同义改写、回译、数值替换、反向问答等可在不改变语义的前提下扩充文本样本。依据省赛技术文件实操模块A与大纲第48条。","source":"原创","id":"DATA-021","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"中","question":"下列属于图像数据增强方法的是？","options":{"B":"随机翻转与旋转裁剪","A":"把标签改成同义词","C":"回译","D":"词干还原"},"answer":"B","explanation":"翻转、旋转、裁剪、缩放、色彩抖动、Mixup等几何/色彩变换是图像增强常用手段，可提升模型泛化与小目标鲁棒性。依据大纲第48条。","source":"原创","id":"DATA-022","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"难","question":"孤立森林（Isolation Forest）检测异常点的原理是？","options":{"C":"异常点在随机切分中更容易被孤立，路径更短","A":"异常点距离质心最近","B":"异常点的方差一定为零","D":"异常点自动聚集在新簇中心"},"answer":"C","explanation":"随机划分空间时稀疏离群的样本平均只需很少切分即被隔离，以其平均路径长度打分，适合高维大数据的异常检测。","source":"原创","id":"DATA-023","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"难","question":"SMOTE过采样的核心机制是？","options":{"D":"在少数类样本近邻间线性插值生成新样本","A":"复制多数类样本","B":"随机删除少数类","C":"把类别标签取反"},"answer":"D","explanation":"SMOTE对少数类找k近邻并在连线上插值合成新样本，避免简单复制导致的过拟合，是类别不平衡的经典手段。","source":"原创","id":"DATA-024","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"难","question":"缺失机制“缺失完全随机（MCAR）”的含义是？","options":{"A":"缺失与任何变量都无关，纯粹偶然","B":"缺失取决于其他观测变量","C":"缺失取决于缺失值本身","D":"数据一定没有缺失"},"answer":"A","explanation":"MCAR下缺失与观测与未观测值均无关；取决于其他观测变量是MAR，取决于未观测的真值是MNAR，三者决定填充策略与偏差分析。","source":"原创","id":"DATA-025","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"难","question":"YOLO系列检测数据集的txt标注行“0 0.5 0.5 0.2 0.4”的含义是？","options":{"B":"类别0，中心(0.5,0.5)，宽0.2高0.4（均归一化）","A":"类别0，框左上角像素坐标","C":"五个互不相关的类别编号序列","D":"图像的宽度、高度与通道数"},"answer":"B","explanation":"YOLO格式为class cx cy w h，坐标与尺寸均按图像宽高归一化到0~1；左上角坐标+像素单位是COCO/VOC的做法。","source":"原创","id":"DATA-026","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"难","question":"COCO格式的bbox字段[x, y, w, h]的含义是？","options":{"C":"左上角坐标x、y与框的宽高（像素）","A":"中心点坐标与角度","B":"归一化的中心与宽高","D":"四个多边形顶点"},"answer":"C","explanation":"COCO的bbox以左上角像素坐标加宽高存储在annotations中，配合image_id、category_id构成完整标注；归一化中心式是YOLO格式。","source":"原创","id":"DATA-027","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"难","question":"COUNT(*)与COUNT(字段名)的关键区别是？","options":{"D":"前者统计所有行，后者跳过该字段为NULL的行","A":"后者统计更快且包含NULL","B":"前者只能用于空表","C":"两者永远相等"},"answer":"D","explanation":"COUNT(*)按行计数含NULL，COUNT(col)只数非NULL值；漏用这一点常导致统计口径偏差。","source":"原创","id":"DATA-028","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"难","question":"SQL子句的逻辑执行顺序正确的是？","options":{"A":"FROM→WHERE→GROUP BY→HAVING→SELECT→ORDER BY","B":"SELECT→FROM→WHERE→GROUP BY","C":"WHERE→FROM→SELECT→ORDER BY","D":"GROUP BY→FROM→WHERE→HAVING"},"answer":"A","explanation":"先定位表与过滤行，再分组与组过滤，然后才投影列与排序；理解该顺序即可解释“WHERE里为什么不能用聚合函数”。","source":"原创","id":"DATA-029","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"难","question":"主动学习（Active Learning）挑选待标注样本的策略通常是？","options":{"B":"优先让模型标注最不确定的样本交人工确认","A":"随机抽样本让人工标注","C":"只标注模型已很确信的样本","D":"把全部数据交给客服标注"},"answer":"B","explanation":"以不确定性采样等准则挑选信息量最大的样本，用最少标注预算提升模型效果，是人机协同标注的核心思想。","source":"原创","id":"DATA-030","domain":"数据工程与标注","verified":true},{"type":"判断","difficulty":"易","question":"BIO标注体系中，B标记实体的开始，I标记实体的内部，O标记非实体成分。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"B/I/O分别对应Begin、Inside、Outside，是命名实体识别等序列标注任务的标准编码方式。","source":"原创","id":"DATA-031","domain":"数据工程与标注","verified":true},{"type":"判断","difficulty":"易","question":"为数据库表建立索引只会提升性能，没有任何代价。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"索引加速查询，但每次写入需同步维护索引结构、占用额外存储，读写代价此消彼长，应按查询模式建必要的索引。","source":"原创","id":"DATA-032","domain":"数据工程与标注","verified":true},{"type":"判断","difficulty":"中","question":"SMOTE通过在少数类样本之间插值来生成新的少数类样本。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"在少数类样本及其近邻连线上插值合成新样本，缓解简单复制带来的记忆化过拟合。","source":"原创","id":"DATA-033","domain":"数据工程与标注","verified":true},{"type":"判断","difficulty":"中","question":"ETL中的Transform环节指的是数据抽取。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"ETL=抽取Extract、转换Transform、加载Load；抽取是Extract环节，Transform负责清洗、映射、聚合等转换处理。","source":"原创","id":"DATA-034","domain":"数据工程与标注","verified":true},{"type":"判断","difficulty":"难","question":"构建时间序列预测的训练/测试集时，可以完全随机打乱样本顺序划分。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"时间序列须按时间先后切分（用过去预测未来），随机打乱会让未来信息泄漏进训练集，离线虚高而线上失效。","source":"原创","id":"DATA-035","domain":"数据工程与标注","verified":true},{"type":"多选","difficulty":"中","question":"保证标注质量的有效管理措施包括？","options":{"D":"先制定标注规范并对标注员培训考核","C":"采用双人独立标注加分歧仲裁","A":"按比例抽检并用Kappa监控一致性","B":"标注只做一遍且不再复核"},"answer":"ACD","explanation":"规范先行、双标仲裁、抽检与一致性度量是标注质量体系的标配；B恰是质量事故的常见来源。依据大纲第15、16条。","source":"原创","id":"DATA-036","domain":"数据工程与标注","verified":true},{"type":"多选","difficulty":"难","question":"关于数据库索引与查询优化，下列说法正确的有？","options":{"C":"索引能加速按条件查询","B":"索引会增加写入与存储开销","D":"主键通常自动创建唯一索引","A":"索引建得越多查询一定越快"},"answer":"BCD","explanation":"C、B、D准确描述索引的收益与代价；过多索引浪费空间且让优化器选择变差，并非越多越好。","source":"原创","id":"DATA-037","domain":"数据工程与标注","verified":true},{"type":"多选","difficulty":"难","question":"处理类别不平衡数据的合理手段包括？","options":{"D":"对少数类过采样（如SMOTE）","C":"对多数类欠采样","B":"训练时设置类别权重","A":"直接删除全部少数类样本"},"answer":"BCD","explanation":"过采样、欠采样与代价敏感学习是三大主流手段；删除少数类等于放弃目标事件，A错误。","source":"原创","id":"DATA-038","domain":"数据工程与标注","verified":true},{"type":"多选","difficulty":"难","question":"关于数据集划分与防泄漏，下列做法正确的有？","options":{"A":"标准化等统计量只在训练集上拟合","C":"测试集不参与任何调参与特征选择","B":"划分前先做按行去重防止同源样本跨集","D":"用测试集反馈反复调整模型再评估"},"answer":"ABC","explanation":"统计量仅从训练集估计、测试集只用于最终评估、去重防跨集泄漏都是防数据泄漏要点；D属于隐性调参泄漏。","source":"原创","id":"DATA-039","domain":"数据工程与标注","verified":true},{"type":"单选","difficulty":"易","question":"RESTful API中GET方法的标准语义是？","options":{"A":"获取资源且不改变服务端状态","B":"删除资源","C":"新建资源","D":"替换整个资源"},"answer":"A","explanation":"GET只读且幂等；POST新建、PUT替换、DELETE删除，四种动词对应资源的增查改删。依据成都赛通知理论范围（RESTful API）。","source":"原创","id":"SYS-001","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"易","question":"RESTful风格中，向服务端创建一个新资源通常使用的方法是？","options":{"B":"POST","A":"GET","C":"HEAD","D":"OPTIONS"},"answer":"B","explanation":"POST向集合资源提交新实例（如POST /users创建用户）；GET只读，HEAD/OPTIONS用于元信息探测。","source":"原创","id":"SYS-002","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"易","question":"HTTP状态码404表示？","options":{"C":"请求的资源未找到","A":"服务器内部错误","B":"请求成功","D":"未授权访问"},"answer":"C","explanation":"404属于4xx客户端错误，表示URL对应的资源不存在；500才是服务器内部错误，200为成功。","source":"原创","id":"SYS-003","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"易","question":"HTTP状态码500表示？","options":{"D":"服务器内部错误","A":"资源未找到","B":"需要登录","C":"重定向"},"answer":"D","explanation":"5xx是服务端错误族，500表明服务端处理时发生异常；排查时应查服务日志中的堆栈信息。","source":"原创","id":"SYS-004","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"易","question":"RESTful API设计时，URI通常应该表达的是？","options":{"A":"资源（名词），如/users/123","B":"动作（动词），如/getUserById","C":"数据库密码","D":"前端框架名称"},"answer":"A","explanation":"REST以名词URI定位资源、用HTTP方法表达操作；把动词写进URI（getUser）是常见的反模式。","source":"原创","id":"SYS-005","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"易","question":"消息队列在系统中的典型价值不包括？","options":{"B":"立即同步阻塞用户请求直至处理完成","A":"异步解耦上下游服务","C":"削峰填谷缓冲瞬时高并发","D":"失败重试与顺序保障"},"answer":"B","explanation":"消息队列的价值正是把同步等待改为异步投递，实现解耦、削峰与可靠重试；B描述的是被它取代的模式。","source":"原创","id":"SYS-006","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"易","question":"Redis在Web系统中最常见的角色是？","options":{"C":"内存键值缓存","A":"模型训练加速器","B":"代码编译器","D":"图片标注工具"},"answer":"C","explanation":"Redis基于内存的键值存储，常用作热点数据缓存与会话存储，显著降低数据库读压力。","source":"原创","id":"SYS-007","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"易","question":"Flask中把函数注册为接口路由的典型写法是？","options":{"D":"@app.route('/api/predict')装饰器","A":"new Route()对象","B":"route.cfg配置段","C":"在HTML里写<a>标签"},"answer":"D","explanation":"Flask用装饰器把Python函数绑定到URL路径，函数返回值即响应体，轻量灵活适合模型服务封装。依据成都赛通知实操范围（Flask）。","source":"原创","id":"SYS-008","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"易","question":"Docker中镜像（Image）与容器（Container）的关系类比于？","options":{"A":"类与实例","B":"文件与硬盘","C":"司机与乘客","D":"网线与路由器"},"answer":"A","explanation":"镜像是静态模板（类），容器是镜像的一次运行实例，同一镜像可启动多个相互隔离的容器。","source":"原创","id":"SYS-009","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"易","question":"git commit的作用是？","options":{"B":"把暂存区的修改提交到本地仓库","A":"把代码推送到远程仓库","C":"下载远程代码","D":"创建新的分支"},"answer":"B","explanation":"commit形成本地版本记录；推送到远程是push，拉取远程是pull/clone。","source":"原创","id":"SYS-010","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"中","question":"HTTP 401与403的区别是？","options":{"C":"401未通过认证（没登录/凭证无效），403已认证但无权限","A":"401服务器宕机，403网络断开","B":"两者都表示请求已成功处理完成","D":"403表示请求已经成功返回结果"},"answer":"C","explanation":"401 Unauthorized实指未认证，应携带或更新凭证；403 Forbidden是认证后的越权访问，凭证再重试也无用。","source":"原创","spot":true,"id":"SYS-011","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"中","question":"RESTful接口成功创建资源后，规范返回的状态码是？","options":{"D":"201 Created","A":"200 OK","B":"404 Not Found","C":"302 Found"},"answer":"D","explanation":"201明确表达“已创建”并常带Location头指向新资源；200是一般成功，302是重定向，404是未找到。","source":"原创","id":"SYS-012","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"中","question":"调用网关后端服务时收到502 Bad Gateway，最可能的判断是？","options":{"A":"网关收到了上游服务无效响应，上游可能崩溃或不可达","B":"请求的JSON格式错误","C":"用户未登录或登录凭证已过期","D":"客户端网络连接已经完全中断"},"answer":"A","explanation":"502是网关/代理错误，指上游服务返回无效响应；请求格式错误是400族，未登录是401，均属客户端侧问题。","source":"原创","id":"SYS-013","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"中","question":"gRPC通信所基于的传输协议是？","options":{"B":"HTTP/2","A":"HTTP/1.0","C":"FTP","D":"SMTP"},"answer":"B","explanation":"gRPC构建在HTTP/2之上，利用其多路复用与流式帧能力，配合Protobuf实现高性能RPC。依据成都赛通知理论范围（gRPC）。","source":"原创","id":"SYS-014","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"中","question":"gRPC默认使用的序列化格式是？","options":{"C":"Protocol Buffers（Protobuf）","A":"逗号分隔的纯文本CSV格式","B":"可扩展标记语言XML文本","D":"人类可读的YAML配置格式"},"answer":"C","explanation":"Protobuf二进制序列化体积小、编解码快，配合接口定义文件（.proto）自动生成多语言代码。","source":"原创","id":"SYS-015","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"中","question":"海量日志流的采集与实时订阅分发，最适合选用的组件是？","options":{"D":"Kafka","A":"SQLite","B":"Matplotlib","C":"jieba"},"answer":"D","explanation":"Kafka是高吞吐分布式消息流平台，发布订阅模型天然适配日志管道、埋点回流等场景。","source":"原创","id":"SYS-016","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"中","question":"FastAPI相对Flask的显著特性是？","options":{"A":"原生异步支持并自动生成交互式API文档","B":"完全不支持JSON","C":"只能运行在Windows","D":"不提供路由功能"},"answer":"A","explanation":"FastAPI基于ASGI支持async、用Pydantic做类型校验并自动产出Swagger文档，适合高性能模型推理服务。依据成都赛通知实操范围（FastAPI）。","source":"原创","id":"SYS-017","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"中","question":"JWT令牌的标准结构是？","options":{"B":"头部.载荷.签名 三段式","A":"用户名:密码","C":"四段波浪线分隔","D":"单个随机整数"},"answer":"B","explanation":"Header声明算法、Payload携带声明（如过期时间）、Signature防篡改，服务端凭签名即可无状态校验身份。","source":"原创","id":"SYS-018","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"中","question":"docker run命令中-p 8000:80的含义是？","options":{"C":"宿主机8000端口映射到容器80端口","A":"容器8000映射宿主机80","B":"限制CPU为8000核","D":"设置环境变量"},"answer":"C","explanation":"-p 宿主端口:容器端口，外部访问宿主机8000即到达容器内80端口的服务。","source":"原创","id":"SYS-019","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"中","question":".gitignore文件的作用是？","options":{"D":"声明Git无需跟踪的文件与目录","A":"列出必须提交的密码","B":"指定Git版本号","C":"自动生成README"},"answer":"D","explanation":"数据集、密钥、临时缓存等不应入库的路径写入.gitignore，避免仓库膨胀与敏感信息泄露。","source":"原创","id":"SYS-020","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"中","question":"Nginx在生产架构中“反向代理+负载均衡”的含义是？","options":{"A":"统一接收外部请求并分发到多个后端服务","B":"代替开发人员写代码","C":"把请求全部转发给同一台机器","D":"加密数据库磁盘"},"answer":"A","explanation":"Nginx作为统一入口屏蔽后端拓扑，按策略（轮询、权重等）把流量分发给多实例，兼做TLS终结与静态资源服务。","source":"原创","id":"SYS-021","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"难","question":"PUT与PATCH方法的语义区别是？","options":{"B":"PUT整体替换资源，PATCH对资源做部分修改","A":"PUT只能用于文本","C":"PATCH必须删除资源","D":"两者完全等价"},"answer":"B","explanation":"PUT提交完整表示做幂等替换；PATCH只传变更字段做部分更新，语义上更精细，二者不可混用。","source":"原创","id":"SYS-022","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"难","question":"对比gRPC与REST，正确的结论是？","options":{"C":"gRPC二进制传输支持双向流更适合内部微服务，REST文本化通用性更好","A":"gRPC已完全取代REST，没有并存场景","B":"REST的总体性能必然优于gRPC","D":"gRPC不能传输任何结构化数据"},"answer":"C","explanation":"gRPC以Protobuf+HTTP/2换取高性能与流式调用，适合内部服务间通信；REST浏览器友好、调试直观，对外开放接口仍是主流。","source":"原创","id":"SYS-023","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"难","question":"FastAPI中用Pydantic模型定义请求体的主要收益是？","options":{"D":"自动完成类型校验并给出清晰的422错误详情","A":"自动把请求转发给数据库","B":"免除所有安全检查","C":"让接口不需要鉴权"},"answer":"D","explanation":"声明字段类型与约束后，非法请求在入口即被拦截并返回结构化错误，省去手写校验且文档同步更新。","source":"原创","id":"SYS-024","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"难","question":"线上接口偶发超时，系统化定位的正确顺序是？","options":{"A":"看监控与日志定位慢在哪一环，再用链路追踪核实依赖调用耗时","B":"立即重启全部服务器后再观察","C":"先把数据库升级到最新版本","D":"把超时参数改大到不再报警"},"answer":"A","explanation":"先观测后处置：日志看错误堆栈、指标看资源水位、链路追踪看逐跳耗时，才能区分网络、应用或下游瓶颈；盲目重启与调大超时只是掩盖问题。依据大纲第27、37条。","source":"原创","id":"SYS-025","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"难","question":"服务进程被系统OOM Killer终止，最直接的处置方向是？","options":{"B":"排查内存泄漏与大对象驻留，优化内存或调整资源上限","A":"增加服务器的CPU核心数量","C":"更换更高分辨率的显示器","D":"把日志输出级别调得更高"},"answer":"B","explanation":"OOM是内存耗尽触发保护性杀进程，应分析内存占用（泄漏、缓存无界、批过大），加CPU或调日志均不对症。","source":"原创","id":"SYS-026","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"难","question":"docker run中使用-v /data:/app/data的作用是？","options":{"C":"把宿主机/data目录挂载进容器/app/data持久化数据","A":"把容器镜像复制到宿主机目录","B":"设置容器内运行的环境变量","D":"限制容器可用的网络带宽上限"},"answer":"C","explanation":"数据卷把有状态数据放到容器生命周期之外，容器重建后数据仍保留，是数据库、模型文件持久化的标准做法。","source":"原创","id":"SYS-027","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"难","question":"Kubernetes中Pod的概念是？","options":{"D":"最小部署调度单元，可含一个或多个共享网络的容器","A":"一台物理服务器","B":"一个数据库账号","C":"一种编程语言"},"answer":"D","explanation":"Pod封装一至多个紧耦合容器，共享存储与网络命名空间，是K8s调度与扩缩的基本单位。","source":"原创","id":"SYS-028","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"难","question":"蓝绿部署与金丝雀（灰度）发布的主要区别是？","options":{"A":"蓝绿是两套环境整体切换，金丝雀先放小流量再逐步扩大","B":"蓝绿只发布数据库","C":"金丝雀必须回滚全部用户","D":"两者没有任何区别"},"answer":"A","explanation":"蓝绿准备全量新环境后一刀切换、回滚快但资源翻倍；金丝雀按比例引流观察指标，风险释放更平滑。","source":"原创","id":"SYS-029","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"难","question":"微服务链路中为防止下游故障引发上游级联耗尽（雪崩），常用的手段是？","options":{"B":"熔断降级并设置调用超时","A":"把所有服务合并成一个","C":"无限重试失败请求","D":"关闭全部日志"},"answer":"B","explanation":"熔断器在错误率超阈值时快速失败并降级兜底，配合超时与有限重试保护上游资源；无限重试反而加速雪崩。","source":"原创","id":"SYS-030","domain":"系统集成与API","verified":true},{"type":"判断","difficulty":"易","question":"git clone命令的作用是把本地代码推送到远程仓库。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"clone是从远程仓库完整复制代码与提交历史到本地；把本地提交推送上远程的是push。","source":"原创","id":"SYS-031","domain":"系统集成与API","verified":true},{"type":"判断","difficulty":"易","question":"Docker容器共享宿主机内核，启动速度通常远快于传统虚拟机。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"容器是进程级隔离（namespace/cgroups）而非虚拟化整套硬件与内核，秒级启动且开销小。","source":"原创","id":"SYS-032","domain":"系统集成与API","verified":true},{"type":"判断","difficulty":"中","question":"git push命令将本地仓库的提交推送到远程仓库。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"本地commit只落在本机版本库，push之后提交才同步到远程（如GitLab），供团队协作。","source":"原创","id":"SYS-033","domain":"系统集成与API","verified":true},{"type":"判断","difficulty":"中","question":"CI/CD中的“CD”只能指持续部署（Continuous Deployment）。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"CD既可指持续交付（Delivery，发布需人工批准）也可指持续部署（Deployment，通过即自动上线），语境中两者都常用。","source":"原创","id":"SYS-034","domain":"系统集成与API","verified":true},{"type":"判断","difficulty":"难","question":"微服务架构中，下游服务持续超时可能拖垮整条调用链，因此需要熔断与降级机制。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"无保护的重试等待会耗尽上游连接与线程资源形成雪崩；熔断快速失败、降级返回兜底结果，是微服务韧性的关键设计。","source":"原创","id":"SYS-035","domain":"系统集成与API","verified":true},{"type":"多选","difficulty":"中","question":"符合RESTful API设计规范的做法有？","options":{"C":"URI用名词表示资源","D":"用HTTP方法表达增删改查","A":"接口无状态，会话信息不依赖服务端内存","B":"必须强制所有客户端使用SOAP协议"},"answer":"ACD","explanation":"资源化URI、方法语义化与无状态是REST三要素；SOAP是与REST并列的另一套协议风格，“必须使用”不成立。","source":"原创","id":"SYS-036","domain":"系统集成与API","verified":true},{"type":"多选","difficulty":"中","question":"提升线上服务高可用的有效措施包括？","options":{"B":"多副本部署配合负载均衡","A":"配置健康检查自动摘除故障节点","D":"限流与降级保护核心链路","C":"把全部服务部署在单台服务器"},"answer":"ABD","explanation":"冗余、探活与流量治理是高可用三大支柱；单点部署与高可用目标背道而驰。","source":"原创","id":"SYS-037","domain":"系统集成与API","verified":true},{"type":"多选","difficulty":"难","question":"关于Docker与容器化，下列说法正确的有？","options":{"A":"镜像由分层结构构成且本身只读","D":"容器之间相互隔离，故障不直接波及彼此","B":"数据卷（Volume）用于容器外的数据持久化","C":"容器运行时写入的修改会自动同步回镜像"},"answer":"ABD","explanation":"容器写入发生在可写层，删除容器即丢失且不会写回只读镜像，持久化须靠数据卷挂载，C错误；A、D、B是容器化机制的准确描述。","source":"原创","id":"SYS-038","domain":"系统集成与API","verified":true},{"type":"多选","difficulty":"难","question":"关于API接口安全，下列做法正确的有？","options":{"D":"使用HTTPS加密传输","B":"采用API Key或JWT等鉴权机制","C":"对接口做限流防止滥用","A":"将密钥硬编码写进前端页面"},"answer":"BCD","explanation":"传输加密、身份鉴权与限流是接口安全基线；密钥硬编码在前端等于公开泄露，属高危反模式。","source":"原创","id":"SYS-039","domain":"系统集成与API","verified":true},{"type":"单选","difficulty":"易","question":"图灵测试判断“机器具有智能”的标准是？","options":{"A":"人在对话中无法区分对方是机器还是人","B":"机器的运算速度超过人类","C":"机器能存储1TB数据","D":"机器的外形与人类相同"},"answer":"A","explanation":"图灵提出以对话不可分辨性作为智能的行为判据，关注外在表现而非内部构造与速度容量。","source":"原创","id":"GEN-001","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"易","question":"人工智能学科公认的诞生标志是？","options":{"B":"1956年达特茅斯会议","A":"1946年ENIAC问世","C":"1997年深蓝胜卡斯帕罗夫","D":"2016年AlphaGo胜李世石"},"answer":"B","explanation":"1956年达特茅斯会议上“人工智能”一词正式提出并确立学科方向；深蓝与AlphaGo是里程碑应用而非学科起点。","source":"原创","id":"GEN-002","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"易","question":"传统专家系统的两个核心组成部分是？","options":{"C":"知识库与推理机","A":"编码器与解码器","B":"生成器与判别器","D":"消息队列与数据库"},"answer":"C","explanation":"专家系统以领域规则知识库加推理机模拟专家决策，是符号主义AI的代表成果。","source":"原创","id":"GEN-003","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"易","question":"强化学习框架中智能体与环境交互的三要素是？","options":{"D":"状态、动作、奖励","A":"输入、输出、标签","B":"主键、外键、索引","C":"请求、响应、重定向"},"answer":"D","explanation":"智能体观测状态、执行动作、获得环境反馈的奖励，以最大化累积奖励学习策略，与监督学习的“标签”范式不同。","source":"原创","id":"GEN-004","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"易","question":"AIGC指的是？","options":{"A":"人工智能生成内容","B":"自动化集成电路设计","C":"代理网关协议","D":"阵列式图形计算器"},"answer":"A","explanation":"AIGC（AI Generated Content）指利用生成式人工智能产出文本、图像、音频、视频等内容的技术与应用形态。","source":"原创","id":"GEN-005","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"易","question":"生成对抗网络（GAN）由哪两部分组成并通过对抗训练？","options":{"B":"生成器与判别器","A":"编码器与解码器","C":"检索器与重排器","D":"控制器与存储器"},"answer":"B","explanation":"生成器造样本迷惑判别器，判别器学习分辨真假，二者博弈推动生成质量提升，是AIGC的经典范式之一。","source":"原创","id":"GEN-006","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"易","question":"多模态大模型的“多模态”是指？","options":{"C":"能同时处理文本、图像、音频等多种信息形式","A":"只能在多种GPU上运行","B":"支持多个用户同时提问","D":"拥有多个API密钥"},"answer":"C","explanation":"模态指信息的表征形式（文本、图像、语音、视频等），多模态模型实现跨模态理解与生成，如视觉问答与文生图。依据大纲第2条。","source":"原创","id":"GEN-007","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"易","question":"ASR技术的功能是？","options":{"D":"把语音自动转写为文本","A":"把文本合成为语音","B":"压缩音频文件","C":"检测网络延迟"},"answer":"D","explanation":"ASR（自动语音识别）实现语音到文本；文本到语音是TTS，两者构成语音链路的输入输出端。","source":"原创","id":"GEN-008","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"中","question":"主张智能来源于神经元连接、以神经网络模拟智能的学派是？","options":{"A":"连接主义","B":"符号主义","C":"行为主义","D":"经验主义"},"answer":"A","explanation":"连接主义以人工神经网络为核心；符号主义强调符号运算与逻辑推理，行为主义强调感知—行动的智能进化。","source":"原创","id":"GEN-009","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"中","question":"弱人工智能与强人工智能的区别在于？","options":{"B":"弱AI只面向特定任务，强AI指具备通用智能与自我意识","A":"弱AI不能运行在服务器上","C":"强AI就是更深的网络","D":"两者只是营销名称差异"},"answer":"B","explanation":"当前所有系统（含大模型）都属于面向具体任务的弱AI；具备人类水平通用认知的强AI尚未实现。","source":"原创","id":"GEN-010","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"中","question":"知识图谱中知识的基本表示单位是？","options":{"C":"三元组（实体-关系-实体）","A":"像素矩阵","B":"音频采样点","D":"二叉树节点"},"answer":"C","explanation":"知识图谱以（头实体，关系，尾实体）三元组刻画事实网络，支持图检索与多跳推理，是知识增强生成的重要外挂。依据大纲第38条。","source":"原创","spot":true,"id":"GEN-011","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"中","question":"“从一般前提出发推出特殊结论”的推理方式是？","options":{"D":"演绎推理","A":"归纳推理","B":"类比推理","C":"排除推理"},"answer":"D","explanation":"演绎从一般到特殊（经典三段论），归纳从特殊到一般；大模型的思维链提示常引导显式的演绎式步骤。","source":"原创","id":"GEN-012","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"中","question":"扩散模型（Diffusion）生成图像的基本机制是？","options":{"A":"前向逐步加噪训练，反向逐步去噪生成","B":"直接从数据库检索相似图片","C":"把图像切分成文字存储","D":"随机涂抹颜色直至饱和"},"answer":"A","explanation":"训练时学习把加噪图像逐步还原，生成时从纯噪声出发迭代去噪得到图像，是Stable Diffusion等文生图模型的内核。","source":"原创","id":"GEN-013","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"中","question":"强化学习中“探索与利用”权衡指的是？","options":{"B":"尝试新动作获取信息还是沿用已知最优动作","A":"增加数据还是删除数据","C":"训练集与测试集的比例","D":"GPU与内存的分配"},"answer":"B","explanation":"只利用可能陷入次优策略，只探索则浪费收益，常用ε-greedy等策略在两者间取得平衡以最大化长期奖励。","source":"原创","id":"GEN-014","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"中","question":"宽度优先搜索（BFS）在实现上依赖的数据结构是？","options":{"C":"队列","A":"栈","B":"堆","D":"哈希表"},"answer":"C","explanation":"BFS按层扩展，先访问的结点先处理，天然对应先进先出的队列；栈对应深度优先搜索。","source":"原创","id":"GEN-015","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"难","question":"生成式模型与判别式模型的区别在于？","options":{"D":"生成式建模联合分布可采样造新样本，判别式直接建模条件分布用于判别","A":"生成式模型只能用于处理文本数据","B":"判别式必须有标签而生成式永远无标签","C":"两者在数学形式上完全等价统一"},"answer":"D","explanation":"朴素贝叶斯、GAN、扩散模型等对数据分布建模故能生成；逻辑回归、SVM等直接学判别边界；判别任务上判别式常更高效。","source":"原创","id":"GEN-016","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"难","question":"A*算法区别于普通最短路搜索的关键是？","options":{"A":"用启发式函数估计剩余代价指导扩展顺序","B":"从不访问任何结点两次","C":"只能用于社交网络","D":"不需要起点和终点"},"answer":"A","explanation":"A*按g(n)+h(n)（已耗+启发估计）排序扩展，满足可采纳性的启发式下能找到最优解且比盲目搜索高效。","source":"原创","id":"GEN-017","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"难","question":"Q-learning算法属于？","options":{"B":"无模型的值函数强化学习方法","A":"有监督分类算法","C":"无监督聚类算法","D":"图渲染算法"},"answer":"B","explanation":"Q-learning不依赖环境转移模型（无模型），通过时序差分更新状态-动作值函数Q，配合ε-greedy学习最优策略。","source":"原创","id":"GEN-018","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"难","question":"马尔可夫决策过程（MDP）“马尔可夫性”的含义是？","options":{"C":"下一状态只依赖当前状态与动作，与历史无关","A":"状态转移概率永远为1","B":"奖励必须等于零","D":"环境必须是确定性的"},"answer":"C","explanation":"当前状态已含决策所需全部信息（无记忆性），这一假设让贝尔曼方程与动态规划求解成立，环境本身仍可以是随机的。","source":"原创","id":"GEN-019","domain":"AI通识与AIGC","verified":true},{"type":"单选","difficulty":"难","question":"大模型的“涌现能力”是指？","options":{"D":"规模跨过阈值后出现小模型完全不具备的新能力","A":"模型在训练中自动关机","B":"输出随机变成另一种语言","C":"参数自动翻倍"},"answer":"D","explanation":"上下文学习、思维链推理等能力随参数与数据规模呈非线性跃迁，小模型近乎为零而大模型骤升，是规模定律研究的重要现象。","source":"原创","id":"GEN-020","domain":"AI通识与AIGC","verified":true},{"type":"判断","difficulty":"中","question":"强化学习需要人工为每个状态标注正确的动作标签。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"强化学习通过环境奖励信号试错学习，不需要逐状态的正确动作标注，这正是它与监督学习的本质区别。","source":"原创","id":"GEN-021","domain":"AI通识与AIGC","verified":true},{"type":"判断","difficulty":"中","question":"符号主义认为智能可以通过符号运算与逻辑推理实现。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"符号主义以物理符号系统假说为基础，专家系统与知识图谱是其代表；与之相对的连接主义主张神经网络。","source":"原创","id":"GEN-022","domain":"AI通识与AIGC","verified":true},{"type":"判断","difficulty":"难","question":"Scaling Law表明模型性能只由参数量决定，与数据和算力无关。","options":{"A":"正确","B":"错误"},"answer":"错误","explanation":"规模定律刻画参数量、数据量与训练算力三者协同的幂律关系，固定数据或算力单纯堆参数并不能持续提升性能。","source":"原创","id":"GEN-023","domain":"AI通识与AIGC","verified":true},{"type":"判断","difficulty":"难","question":"CLIP通过对海量图文对做对比学习，把图像与文本映射到同一嵌入空间实现对齐。","options":{"A":"正确","B":"错误"},"answer":"正确","explanation":"CLIP以对比损失拉近匹配图文对、推开非匹配对，使“文本描述”可直接检索图像，是多模态对齐的奠基性工作。","source":"原创","id":"GEN-024","domain":"AI通识与AIGC","verified":true},{"type":"多选","difficulty":"中","question":"人工智能发展史上的三大主要学派包括？","options":{"C":"符号主义","D":"连接主义","A":"行为主义","B":"机会主义"},"answer":"ACD","explanation":"符号主义（逻辑推理）、连接主义（神经网络）、行为主义（感知—行动）是公认的三大流派；B为干扰项。","source":"原创","id":"GEN-025","domain":"AI通识与AIGC","verified":true},{"type":"多选","difficulty":"中","question":"下列属于AIGC典型应用的有？","options":{"B":"文生图","A":"语音合成配音","D":"文章自动生成","C":"短视频数字人生成"},"answer":"ABCD","explanation":"四者分别覆盖图像、语音、文本、视频模态的生成，均为大纲第48条“多模态合成数据构建”对应的AIGC应用。","source":"原创","id":"GEN-026","domain":"AI通识与AIGC","verified":true},{"type":"多选","difficulty":"难","question":"关于强化学习的特点，下列说法正确的有？","options":{"C":"奖励往往是延迟反馈而非即时标注","D":"智能体通过试错与环境交互学习","B":"需要在探索与利用之间权衡","A":"训练必须依赖成对的输入输出标签"},"answer":"BCD","explanation":"延迟奖励、试错交互与探索利用权衡是强化学习的标志；逐样本的成对标注是监督学习的特征，A错误。","source":"原创","id":"GEN-027","domain":"AI通识与AIGC","verified":true}];

};
const K = {settings:"qbank_v1_settings"};
const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch(e){ return d; } },

};
// 单库旧版数据迁移到仿真库键下（保留既有进度）
(function(){
  [["qbank_v1_stats","qbank_v1_stats_sim"],["qbank_v1_wrong","qbank_v1_wrong_sim"],
   ["qbank_v1_fav","qbank_v1_fav_sim"],["qbank_v1_exams","qbank_v1_exams_sim"]].forEach(p=>{
    if(localStorage.getItem(p[0])!==null && localStorage.getItem(p[1])===null)
      localStorage.setItem(p[1], localStorage.getItem(p[0]));
  });
})();
let settings = store.get(K.settings, {explain:true, bank:"sim"});
let curBank = BANKS[settings.bank] ? settings.bank : "sim";
let QUESTIONS=[], DOMAINS=[], stats={}, wrongBook={}, fav={}, examHistory=[];
function loadBank(k){
  curBank = k; settings.bank = k;
  QUESTIONS = BANKS[k].qs;
  DOMAINS = [...new Set(QUESTIONS.map(q=>q.domain))];
  stats = store.get("qbank_v1_stats_"+k, {});
  wrongBook = store.get("qbank_v1_wrong_"+k, {});
  fav = store.get("qbank_v1_fav_"+k, {});
  examHistory = store.get("qbank_v1_exams_"+k, []);
  store.set(K.settings, settings);
}
function saveAll(){
  store.set("qbank_v1_stats_"+curBank, stats);
  store.set("qbank_v1_wrong_"+curBank, wrongBook);
  store.set("qbank_v1_fav_"+curBank, fav);
  store.set("qbank_v1_exams_"+curBank, examHistory);
  store.set(K.settings, settings);
}
loadBank(curBank);

let S = null; // session state

function fmtTime(sec){ sec=Math.max(0,Math.floor(sec)); const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60; const p=n=>String(n).padStart(2,"0"); return h>0? h+":"+p(m)+":"+p(s) : p(m)+":"+p(s); }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function saveAll(){ store.set(K.stats,stats); store.set(K.wrong,wrongBook); store.set(K.settings,settings); store.set(K.exams,examHistory); store.set(K.fav,fav); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

    const qs = QUESTIONS.filter(q=>q.domain===d);

  document.getElementById("b-reset").onclick = ()=>{ if(confirm("确定清空全部练习记录、错题与考试历史？此操作不可恢复。")){ stats={};wrongBook={};examHistory=[]; saveAll(); renderHome(); } };
  document.getElementById("e-200").onclick = ()=> startExam(200, 150*60);
  document.getElementById("e-50").onclick = ()=> startExam(50, 40*60);
  // 题库切换
  app.querySelectorAll(".btab").forEach(b=> b.onclick = ()=>{ loadBank(b.dataset.bank); renderHome(); });
  // 官方库无重点抽查时隐藏；单选题不足时调整考试入口
  const nSingle = QUESTIONS.filter(q=>q.type==="单选").length;
  const spotBtn = document.getElementById("m-spot");
  if(!QUESTIONS.some(q=>q.spot)) spotBtn.style.display = "none";
  const e200 = document.getElementById("e-200"), e50 = document.getElementById("e-50");
  if(nSingle < 100){ e200.style.display = "none"; }
  if(nSingle < 50){ e50.textContent = `快速测验 ${nSingle}题 / 40分钟 / 满分${(nSingle*0.4).toFixed(0)}`; }
}

/* ---------- 练习 ---------- */
function filterList(f){
  let list = QUESTIONS.filter(q=> (!f.domain||q.domain===f.domain) && (!f.type||q.type===f.type) && (!f.diff||q.difficulty===f.diff) );
  if(f.onlyNew) list = list.filter(q=>!(stats[q.id]&&stats[q.id].n>0));
  if(f.mode==="rand") list = shuffle(list);
  if(f.count) list = list.slice(0, +f.count);
  return list;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function startPractice(mode, f){
  f.mode = mode;
  let list, title;
  if(mode==="wrong"){ list = shuffle(QUESTIONS.filter(q=>wrongBook[q.id])); title="错题重练"; }
  else if(mode==="fav"){ list = QUESTIONS.filter(q=>fav[q.id]); title="⭐ 收藏练习"; }
  else if(mode==="spot"){ list = QUESTIONS.filter(q=>q.spot); title="重点抽查(验收20题)"; }
  else { list = filterList(f); title = (mode==="rand"?"随机":"顺序")+"练习"; }
  if(!list.length){ alert(f.onlyNew ? "该范围内没有未练过的题了，全部练完！可取消勾选\"只练没做过的题\"进行复习，或换个筛选范围。" : "没有符合条件的题目，请调整筛选。"); return; }
  S = {kind:"practice", mode, title, list, idx:0, answers:{}, startTs:Date.now(), exitFn:renderHome, f};
  renderQuestion();
}

function optionButtons(q, state){
  // state: {chosen:Set, judged:bool, correctSet:Set, examMode:bool}
  const letters = Object.keys(q.options).sort();
  const judge = q.type==="判断" ? ["A","B"] : letters;
  return judge.map(L=>{
    let cls="opt", dis="";
    const chosen = state.chosen.has(L);
    if(chosen) cls += state.examMode? " selected" : (state.judged? (state.correctSet.has(L)?" correct":" wrong") : " selected");
    if(!chosen && state.judged && state.correctSet.has(L)) cls+=" correct";
    if(state.locked) dis="disabled";
    const label = q.type==="判断" ? `<span class="letter">${L==="A"?"✓":"✗"}</span>${esc(q.options[L])}` : `<span class="letter">${L}</span><span>${esc(q.options[L])}</span>`;
    return `<button class="${cls}" ${dis} data-letter="${L}">${label}</button>`;
  }).join("");
}

  app.innerHTML = `

function correctLetters(q){
  return q.type==="判断" ? [q.answer==="正确"?"A":"B"] : q.answer.split("");
}

function chooseLetter(L){
  const q = S.list[S.idx], rec = S.answers[q.id];
  if(rec.judged) return;
  if(q.type==="多选"){
    rec.chosen.has(L)? rec.chosen.delete(L) : rec.chosen.add(L);
    const cm=document.getElementById("confirm-multi");
    if(cm){ cm.classList.remove("hidden"); cm.textContent=`确认答案（已选${rec.chosen.size}项）`; }
    renderOptsState(q, rec);
  } else {
    rec.chosen = new Set([L]);
    judgeCurrent();
  }
}
function renderOptsState(q, rec){
  const opts=document.getElementById("opts");
  opts.innerHTML = optionButtons(q, {...rec, examMode:false});
  opts.querySelectorAll(".opt").forEach(b=> b.onclick=()=>chooseLetter(b.dataset.letter));
}
function judgeCurrent(){
  const q = S.list[S.idx], rec = S.answers[q.id];
  if(rec.judged) return;
  if(q.type==="多选" && rec.chosen.size<1) return;
  const corr = correctLetters(q);
  const chosenStr = [...rec.chosen].sort().join("");
  rec.isRight = q.type==="多选" ? chosenStr===q.answer : (q.type==="判断" ? (chosenStr===(q.answer==="正确"?"A":"B")) : chosenStr===q.answer);
  rec.judged = true; rec.locked = true;
  // 统计与错题本
  const st = stats[q.id] || (stats[q.id]={n:0,c:0});
  st.n++; if(rec.isRight){ st.c++; }
  const prevWrong = wrongBook[q.id];
  if(!rec.isRight){
    if(!prevWrong) wrongBook[q.id] = {date:today(), reason:null, redo:null};
  } else if(prevWrong){
    prevWrong.redo = today();
    delete wrongBook[q.id];
  }
  saveAll();
  renderQuestion();
  const fbEl = document.getElementById("feedback");
  if(fbEl && window.innerHeight < 900) setTimeout(()=>fbEl.scrollIntoView({behavior:"smooth", block:"nearest"}), 60);
}
function showFeedback(q, rec){
  const fb = document.getElementById("feedback");
  const corr = correctLetters(q).join("");
  const reasonHtml = !rec.isRight ? `
    <div class="reasons">错因标记（用于错题本导出）：
      ${["概念不清","记错","审题"].map(r=>`<span class="r ${(wrongBook[q.id]&&wrongBook[q.id].reason===r)?"on":""}" data-r="${r}">${r}</span>`).join("")}
    </div>`:"";
  const expl = `<div class="explain"><b>📖 解析：</b>${esc(q.explanation)}${q.source&&q.source!=="原创"?`<div class="mini" style="margin-top:4px">来源：${esc(q.source)}</div>`:""}</div>`;
  fb.innerHTML = `
    <div class="verdict ${rec.isRight?"ok":"no"}">${rec.isRight? "✅ 回答正确" : "❌ 回答错误"}</div>
    ${!rec.isRight? `<div class="mini">正确答案：<b>${q.answer}</b>${q.type!=="判断"? "（绿色项）":""}</div>`:""}
    ${settings.explain? expl : `<button class="btn ghost sm" id="show-exp">显示解析</button>`}
    ${reasonHtml}`;
  const se = document.getElementById("show-exp"); if(se) se.onclick=()=>{ settings.explain=true; saveAll(); renderQuestion(); };
  fb.querySelectorAll(".r").forEach(r=> r.onclick=()=>{ const w=wrongBook[q.id]; if(w){ w.reason = (w.reason===r.dataset.r? null : r.dataset.r); saveAll(); renderQuestion(); } });
}
function finishPractice(){
  const done = S.list.filter(x=>S.answers[x.id]&&S.answers[x.id].judged);
  const ok = done.filter(x=>S.answers[x.id].isRight).length;
  const total = done.length;
  const app=document.getElementById("app");
  app.innerHTML = `

/* ---------- 模拟考试 ---------- */
let examTimer = null;
function startExam(count, durSec){
  const pool = shuffle(QUESTIONS.filter(q=>q.type==="单选"));
  const list = pool.slice(0, Math.min(count, pool.length));
  S = {kind:"exam", list, idx:0, answers:{}, durSec, remain:durSec, startTs:Date.now(), submitted:false};
  renderExam();
  examTimer = setInterval(()=>{
    if(!S || S.kind!=="exam") { clearInterval(examTimer); return; }
    S.remain--;
    const t=document.getElementById("timer");
    if(t){ t.textContent = fmtTime(S.remain); t.classList.toggle("warn", S.remain<600); }
    if(S.remain<=0){ clearInterval(examTimer); submitExam(true); }
  },1000);
}
function renderExam(){
  const app=document.getElementById("app");
  const q=S.list[S.idx], rec=S.answers[q.id]||(S.answers[q.id]={chosen:new Set()});
  const answered = Object.keys(S.answers).filter(id=>S.answers[id].chosen.size>0).length;
  app.innerHTML = `
  <div class="examhead">
    <div><b>📝 模拟考试</b> <span class="mini">单选 × 0.4分 ｜ 第${S.idx+1}/${S.list.length}题</span></div>

      <span class="mini">已答 <b id="ansc">${answered}</b>/${S.list.length}</span>
      <button class="btn red sm" id="submit">交卷</button>
      <button class="btn ghost sm" id="quit">放弃</button>
    </div>
  </div>
  <div class="card">
    <div class="chips"><span class="chip">${q.id}</span><span class="chip">${q.type}</span><span class="chip d${q.difficulty==="易"?1:q.difficulty==="中"?2:3}">${q.difficulty}</span><span class="chip">${esc(q.domain)}</span></div>
    <div class="qtext">${esc(q.question)}</div>
    <div id="opts">${optionButtons(q,{chosen:rec.chosen,judged:false,correctSet:new Set(),examMode:true})}</div>
    <div class="footer-nav">
      <button class="btn ghost sm" id="prev" ${S.idx===0?"disabled":""}>← 上一题</button>
      <span class="mini">点击选项即作答，可随时修改</span>
      <button class="btn sm" id="next">${S.idx===S.list.length-1?"去交卷 →":"下一题 →"}</button>
    </div>
  </div>
  <div class="card">
    <h2>答题卡</h2>
    <div class="pal">${S.list.map((x,i)=>{
      const r=S.answers[x.id]; const c=r&&r.chosen.size? "ans":"";
      return `<button class="pcell ${c} ${i===S.idx?"cur":""}" data-i="${i}">${i+1}</button>`;
    }).join("")}</div>
  </div>`;
  app.querySelectorAll("#opts .opt").forEach(b=> b.onclick=()=>{
    rec.chosen = new Set([b.dataset.letter]);
    renderExam();
  });
  document.getElementById("prev").onclick=()=>{ if(S.idx>0){S.idx--;renderExam();} };
  document.getElementById("next").onclick=()=>{ if(S.idx<S.list.length-1){S.idx++;renderExam();} else document.getElementById("submit").click(); };
  document.getElementById("quit").onclick=()=>{ if(confirm("放弃本次考试？不计入成绩。")){ clearInterval(examTimer); renderHome(); } };
  document.getElementById("submit").onclick=()=>{ if(confirm("确定交卷？")) submitExam(false); };
  app.querySelectorAll(".pcell").forEach(b=> b.onclick=()=>{ S.idx=+b.dataset.i; renderExam(); });
}
function submitExam(auto){
  clearInterval(examTimer);
  S.submitted = true;
  const unanswered = S.list.filter(q=>!S.answers[q.id]||!S.answers[q.id].chosen.size).length;
  const detail = S.list.map(q=>{
    const rec=S.answers[q.id]||{chosen:new Set()};
    const corr=correctLetters(q)[0];
    const chosen=[...rec.chosen][0]||null;
    const right = chosen===corr;
    const st = stats[q.id]||(stats[q.id]={n:0,c:0});
    st.n++; if(right) st.c++;
    if(!right){ if(!wrongBook[q.id]) wrongBook[q.id]={date:today(),reason:null,redo:null}; }
    else if(wrongBook[q.id]){ wrongBook[q.id].redo=today(); delete wrongBook[q.id]; }
    return {q, chosen, right};
  });
  saveAll();
  const okCount = detail.filter(d=>d.right).length;
  const wrongAnswered = detail.length - okCount - unanswered;
  const score = +(okCount*0.4).toFixed(1);
  examHistory.push({date:today(), mode:S.list.length+"题", score, total:S.list.length*0.4, correct:okCount});
  if(examHistory.length>20) examHistory=examHistory.slice(-20);
  saveAll();
  renderExamResult(detail, score, okCount, wrongAnswered, unanswered, auto);
}
function renderExamResult(detail, score, okCount, wrongAnswered, unanswered, auto){
  const app=document.getElementById("app");
  const byDomain={};
  detail.forEach(d=>{ byDomain[d.q.domain]=byDomain[d.q.domain]||{t:0,c:0}; byDomain[d.q.domain].t++; if(d.right)byDomain[d.q.domain].c++; });
  app.innerHTML = `
  <div class="card">
    <h1>${auto? "⏰ 时间到，自动交卷" : "🎉 考试完成"}</h1>
    <div class="grid4" style="margin:12px 0">
      <div class="stat"><div class="num ${score>=detail.length*0.4*0.6?"okline":"noline"}">${score}分</div><div class="lbl">得分/${(detail.length*0.4).toFixed(0)}分</div></div>
      <div class="stat"><div class="num">${okCount}</div><div class="lbl">正确</div></div>
      <div class="stat"><div class="num">${wrongAnswered}</div><div class="lbl">答错</div></div>
      <div class="stat"><div class="num">${unanswered}</div><div class="lbl">未作答</div></div>
    </div>
    <div class="mini">作答正确率 ${Math.round(okCount/Math.max(1,detail.length-unanswered)*100)}%（按已作答计） ｜ 目标参考：理论24分(60%)及格线、28分(70%)良好线（80分制）</div>
    <table class="tb" style="margin-top:10px"><tr><th>知识域</th><th>题数</th><th>正确</th><th>正确率</th></tr>
      ${Object.entries(byDomain).map(([d,v])=>`<tr><td>${esc(d)}</td><td>${v.t}</td><td>${v.c}</td><td>${Math.round(v.c/v.t*100)}%</td></tr>`).join("")}
    </table>
    <div style="margin-top:14px">
      <label><input type="checkbox" id="only-wrong" checked> 只看错题</label>
    </div>
    <div id="review"></div>
    <div style="margin-top:16px">
      <button class="btn" onclick="renderHome()">返回首页</button>
    </div>
  </div>`;
  const renderReview=(onlyWrong)=>{
    document.getElementById("review").innerHTML = detail
      .filter(d=>!onlyWrong||!d.right)
      .map(d=>{
        const q=d.q, corr=correctLetters(q)[0];
        const opts=Object.keys(q.options).sort().map(L=>{
          let cls="opt"; if(d.chosen===L&&!d.right)cls+=" wrong"; if(corr===L)cls+=" correct";
          return `<button class="${cls}" disabled><span class="letter">${L}</span><span>${esc(q.options[L])}</span></button>`;
        }).join("");
        return `<div class="review-q">
          <div class="chips"><span class="chip">${q.id}</span><span class="chip">${q.type}</span><span class="chip d${q.difficulty==="易"?1:q.difficulty==="中"?2:3}">${q.difficulty}</span><span class="chip">${esc(q.domain)}</span></div>
          <div class="qtext" style="font-size:15px">${esc(q.question)}</div>
          ${opts}
          <div class="mini">你的答案：<b class="${d.right?"okline":"noline"}">${d.chosen||"未作答"}</b> ｜ 正确答案：<b>${q.answer}</b></div>
          <div class="explain" style="margin-top:8px">${esc(q.explanation)}</div>
        </div>`;
      }).join("") || '<div class="sub">没有错题，全对！🎉</div>';
  };
  renderReview(true);
  document.getElementById("only-wrong").onchange=e=>renderReview(e.target.checked);
}

/* ---------- 错题本导出 ---------- */
function exportWrongBook(){
  const ids=Object.keys(wrongBook);
  if(!ids.length){ alert("错题本为空，先去练习吧。"); return; }
  let md = `# 错题本（${today()}导出，共${ids.length}题）\n\n| 日期 | 题号 | 错因分类 | 重做日期 |\n|---|---|---|---|\n`;
  ids.sort().forEach(id=>{
    const w=wrongBook[id];
    md += `| ${w.date||""} | ${id} | ${w.reason||""} | ${w.redo||""} |\n`;
  });
  md += `\n---\n`;
  const block = id=>{
    const q=QUESTIONS.find(x=>x.id===id); if(!q) return "";
    return `\n## ${id}（${q.type}·${q.difficulty}·${q.domain}）\n${q.question}\n\n- 正确答案：${q.answer}\n- 解析：${q.explanation}\n`;
  };
  ids.sort().forEach(id=>{ md += block(id); });
  const favIds = Object.keys(fav).sort();
  if(favIds.length){
    md += `\n---\n\n# 我的收藏（${favIds.length}题）\n`;
    favIds.forEach(id=>{ md += block(id); });
  }
  const blob=new Blob([md],{type:"text/markdown;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`错题本_${today().replace(/-/g,"")}.md`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------- 键盘 ---------- */
document.addEventListener("keydown", e=>{
  if(!S) return;
  if(e.target.tagName==="SELECT"||e.target.tagName==="INPUT") return;
  const keyMap={"1":"A","2":"B","3":"C","4":"D","a":"A","b":"B","c":"C","d":"D"};
  const k=e.key.toLowerCase();
  if(S.kind==="practice"){
    if(keyMap[k]){ chooseLetter(keyMap[k]); }
    else if(k==="enter"||k==="arrowright"){ document.getElementById("next")?.click(); }
    else if(k==="arrowleft"){ document.getElementById("prev")?.click(); }
    else if(k==="f"){ document.getElementById("fav-btn")?.click(); }
  } else if(S.kind==="exam" && !S.submitted){
    if(keyMap[k]){
      const rec=S.answers[S.list[S.idx].id]||(S.answers[S.list[S.idx].id]={chosen:new Set()});
      rec.chosen=new Set([keyMap[k]]); renderExam();
    }
    else if(k==="arrowright"){ const n=document.getElementById("next"); if(n)n.click(); }
    else if(k==="arrowleft"){ const p=document.getElementById("prev"); if(p)p.click(); }
  }
});

renderHome();
</script>
</body>
</html>
